  <script>
(() => {
  const COLORS = ['#103f66', '#ee8c78', '#6cadd3', '#edbd68', '#9bb4b9', '#687f9b', '#b9a78d', '#7e9c89'];
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  const percent = share => `${(share * 100).toLocaleString('zh-TW', { maximumFractionDigits: 1 })}%`;
  const amount = (value, currency) => `${new Intl.NumberFormat('zh-TW', {
    notation: 'compact', maximumFractionDigits: 2
  }).format(value)} ${escape(currency)}`;

  function pie(items) {
    let angle = -Math.PI / 2;
    const slices = items.map((item, index) => {
      const color = COLORS[index % COLORS.length];
      const title = `<title>${escape(item.name)}：${percent(item.share)}</title>`;
      if (items.length === 1) return `<circle cx="120" cy="120" r="108" fill="${color}">${title}</circle>`;
      const start = [120 + 108 * Math.cos(angle), 120 + 108 * Math.sin(angle)];
      angle += item.share * Math.PI * 2;
      const end = [120 + 108 * Math.cos(angle), 120 + 108 * Math.sin(angle)];
      return `<path d="M120 120 L${start.join(' ')} A108 108 0 ${item.share > 0.5 ? 1 : 0} 1 ${end.join(' ')} Z"
        fill="${color}" stroke="white" stroke-width="1.5">${title}</path>`;
    }).join('');
    return `<svg class="revenue-pie" viewBox="0 0 240 240" role="img" aria-label="產品營收圓餅圖，詳細數字見下方表格">${slices}</svg>`;
  }

  function card(data, kind) {
    const product = kind === 'product';
    const title = product ? '產品營收組成' : '地區營收分布';
    if (data?.status !== 'ok' || !Array.isArray(data.items) || !data.items.length) return '';
    const rows = data.items.map((item, index) => `<tr><th scope="row">
      <span class="revenue-swatch" style="background:${COLORS[index % COLORS.length]}"></span>${escape(item.name)}</th>
      <td title="${escape(item.value.toLocaleString('zh-TW'))} ${escape(data.currency)}">${amount(item.value, data.currency)}</td>
      <td>${percent(item.share)}</td></tr>`).join('');
    const graphic = product ? pie(data.items) : `<div class="revenue-bars" aria-hidden="true">${data.items.map((item, index) =>
      `<div class="revenue-bar-row"><div><span>${escape(item.name)}</span><b>${percent(item.share)}</b></div>
      <div class="revenue-bar-track"><span style="width:${item.share * 100}%;background:${COLORS[index % COLORS.length]}"></span></div></div>`).join('')}</div>`;
    return `<article class="revenue-card"><h4>${title}</h4>
      <p class="revenue-period">FY ${escape(data.fiscalYear)}｜年度截至 ${escape(data.date)}｜${escape(data.currency)}</p>
      ${graphic}<div class="revenue-table-scroll"><table><caption>${title}明細</caption>
      <thead><tr><th scope="col">${product ? '產品／業務' : '地區'}</th><th scope="col">營收</th><th scope="col">占比</th></tr></thead>
      <tbody>${rows}</tbody></table></div></article>`;
  }

  window.loadRevenueCharts = async (container, backendUrl, symbol) => {
    if (!container) return;
    const section = container.closest('.revenue-section');
    section.hidden = true;
    if (/^\d{4}(\.TW|\.TWO)?$/i.test(symbol)) {
      return;
    }
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const url = new URL('/api/fmp/revenue-segmentation', backendUrl);
      url.searchParams.set('symbol', symbol);
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error('Revenue data unavailable');
      const data = await response.json();
      if (!container.isConnected) return;
      const cards = [card(data.product, 'product'), card(data.geographic, 'geographic')].filter(Boolean);
      if (!cards.length) return;
      container.innerHTML = `<div class="revenue-grid${cards.length === 1 ? ' revenue-grid--single' : ''}">${cards.join('')}</div>
        <p class="revenue-note">來源：<a href="https://financialmodelingprep.com/" target="_blank" rel="noopener noreferrer">Financial Modeling Prep</a>。
        各圖年度見標示；占比依已披露分項合計計算，未與總營收核對，分類可能重疊。</p>`;
      section.hidden = false;
      const chapter = section.closest('[data-segment-chapter]');
      if (chapter) {
        chapter.hidden = false;
        const link = document.querySelector('[data-report-link="segments"]');
        if (link) link.hidden = false;
      }
    } catch {
      // Optional charts fail silently; the generated report remains readable.
    } finally {
      clearTimeout(timeout);
    }
  };
})();
  const BACKEND_URL = "https://dongcaibao.onrender.com/api/analyze-stock";

  const supabaseUrl = "https://zlkexplsleznuebighte.supabase.co";
  const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
  let currentSearchContext = "";
  let currentSymbol = "";
  let sectionContextRegistry = {};
  let activeSectionContext = { title: "整份公司報告", context: "" };
  
  const PLAN_LIMIT = {
    free: 10,
    plus: 10,
    pro: Infinity
  };

  const planModal = document.getElementById("planModal");
  const planModalBackdrop = document.getElementById("planModalBackdrop");
  const planModalClose = document.getElementById("planModalClose");
  const planModalMessage = document.getElementById("planModalMessage");

  function showPlanModal(message, loginRequired = false) {
    document.getElementById("guestLoginLink").hidden = !loginRequired;
    planModalMessage.textContent = message;
    planModal.classList.add("show");
  }

  function hidePlanModal() {
    planModal.classList.remove("show");
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function normalizeContextText(value, maxLength = 1800) {
    const rawText = typeof value === "string"
      ? value
      : JSON.stringify(value || {}, null, 2);

    return rawText
      .replace(/<[^>]*>/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, maxLength);
  }

  function registerSectionContext(title, context) {
    const id = `section-${Object.keys(sectionContextRegistry).length + 1}`;
    sectionContextRegistry[id] = {
      title,
      context: normalizeContextText(context)
    };
    return id;
  }

  function renderSectionAskButton(title, context) {
    const sectionId = registerSectionContext(title, context);
    return `
      <div class="section-ai-tools">
        <button type="button" class="section-ai-btn" data-section-id="${sectionId}">
          問 AI 這一段
        </button>
      </div>
    `;
  }

  function normalizeValueChainItems(items) {
    if (!Array.isArray(items)) return [];
    return items
      .map(item => String(item || "").trim())
      .filter(Boolean);
  }

  function startAdoptionCard(container) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    const officialUrl = 'https://www.pet.gov.tw/AnimalApp/AnnounceMent.aspx?PageType=Adopt';
    const sourceUrl = 'https://data.gov.tw/dataset/85903';
    const render = data => {
      if (!container.isConnected) return;
      const animal = data?.animal;
      let photo = '';
      try {
        const url = new URL(animal?.photo);
        if (url.protocol === 'https:' && url.hostname.endsWith('.gov.tw') && !url.username && !url.password) photo = url.href;
      } catch { /* Missing photos use the text-only card. */ }
      container.innerHTML = `
        <article class="adoption-card${photo ? ' adoption-card-with-photo' : ''}" aria-label="公益認養資訊">
          ${photo ? `<div class="adoption-card-photo"><img src="${escapeHtml(photo)}" alt="待認養${escapeHtml(animal.kind)}的收容照片" referrerpolicy="no-referrer"></div>` : ''}
          <div class="adoption-card-body">
            <span class="adoption-card-label">公益認養資訊 · 非商業廣告</span>
            <h2>你在等一份報告，牠在等一個家。</h2>
            <p>等待的空檔，認識一位正在找家的小夥伴。認養前，請先評估長期照顧的責任。</p>
            ${animal ? `<dl>
              <div><dt>動物</dt><dd>${escapeHtml(animal.kind)}${animal.variety ? ` · ${escapeHtml(animal.variety)}` : ''}</dd></div>
              <div><dt>收容所</dt><dd>${escapeHtml(animal.shelter)}</dd></div>
              ${animal.location && animal.location !== animal.shelter ? `<div><dt>所在地</dt><dd>${escapeHtml(animal.location)}</dd></div>` : ''}
              ${animal.reference ? `<div><dt>收容編號</dt><dd>${escapeHtml(animal.reference)}</dd></div>` : ''}
            </dl>` : '<p>前往官方平台，查看各地待認養動物的最新資訊。</p>'}
            <a class="adoption-card-link" href="${officialUrl}" target="_blank" rel="noopener noreferrer">前往官方認養平台 ↗</a>
            <small>資料來源：<a href="${sourceUrl}" target="_blank" rel="noopener noreferrer">農業部動物認領養開放資料</a>（政府資料開放授權條款第 1 版）。非政府合作或背書。
              ${animal?.sourceUpdatedAt ? `<br>來源更新：${escapeHtml(animal.sourceUpdatedAt)}` : ''}
              ${data?.fetchedAt ? `<br>本站擷取：${escapeHtml(new Date(data.fetchedAt).toLocaleString('zh-TW'))}` : ''}
              <br>實際認養狀態以收容所確認為準。連結另開分頁，不影響報告生成。
            </small>
          </div>
        </article>`;
      const image = container.querySelector('img');
      if (image) image.addEventListener('error', () => {
        container.querySelector('article').classList.remove('adoption-card-with-photo');
        image.parentElement.remove();
      }, { once: true });
    };
    render(null);
    fetch(new URL('/api/adoption-card', BACKEND_URL), { signal: controller.signal })
      .then(response => {
        if (!response.ok) throw new Error('Adoption information unavailable');
        return response.json();
      })
      .then(data => { if (!controller.signal.aborted) render(data); })
      .catch(() => {})
      .finally(() => clearTimeout(timeout));
    return () => { clearTimeout(timeout); controller.abort(); };
  }

  function extractValueChain(responseText) {
    const text = String(responseText || "");
    const startMarker = "<" + "!-- VALUE_CHAIN_START --" + ">";
    const endMarker = "<" + "!-- VALUE_CHAIN_END --" + ">";
    const startIndex = text.indexOf(startMarker);
    const endIndex = text.indexOf(endMarker, startIndex + startMarker.length);

    if (startIndex === -1 || endIndex === -1) {
      return { valueChain: null, reportText: responseText };
    }

    const rawBlockEnd = endIndex + endMarker.length;
    const rawJsonBlock = text.slice(startIndex + startMarker.length, endIndex);
    const reportText = (text.slice(0, startIndex) + text.slice(rawBlockEnd)).trim();

    try {
      const rawJson = rawJsonBlock
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      const parsed = JSON.parse(rawJson);
      const valueChain = {
        company: String(parsed.company || "").trim(),
        position: String(parsed.position || "").trim(),
        upstream: normalizeValueChainItems(parsed.upstream),
        offerings: normalizeValueChainItems(parsed.offerings),
        customers: normalizeValueChainItems(parsed.customers),
        revenue: normalizeValueChainItems(parsed.revenue)
      };

      return { valueChain, reportText };
    } catch (error) {
      console.warn("價值鏈資料解析失敗，改用純文字報告。", error);
      return { valueChain: null, reportText: reportText.trim() };
    }
  }

  function extractTimeline(responseText) {
    const text = String(responseText || "");
    const startMarker = "<" + "!-- TIMELINE_START --" + ">";
    const endMarker = "<" + "!-- TIMELINE_END --" + ">";
    const startIndex = text.indexOf(startMarker);
    const endIndex = text.indexOf(endMarker, startIndex + startMarker.length);

    if (startIndex === -1 || endIndex === -1) {
      return { timeline: null, reportText: responseText };
    }

    const rawBlockEnd = endIndex + endMarker.length;
    const rawJsonBlock = text.slice(startIndex + startMarker.length, endIndex);
    const reportText = (text.slice(0, startIndex) + text.slice(rawBlockEnd)).trim();

    try {
      const rawJson = rawJsonBlock
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      const parsed = JSON.parse(rawJson);
      const items = Array.isArray(parsed.items)
        ? parsed.items
            .map(item => ({
              period: String(item?.period || "").trim(),
              event: String(item?.event || "").trim(),
              impact: String(item?.impact || "").trim()
            }))
            .filter(item => item.period && item.event)
            .slice(0, 6)
        : [];

      return {
        timeline: items.length ? { items } : null,
        reportText
      };
    } catch (error) {
      console.warn("公司時間線資料解析失敗，改用純文字報告。", error);
      return { timeline: null, reportText: reportText.trim() };
    }
  }

  function extractCoreSummary(responseText) {
    const text = String(responseText || "");
    const startMarker = "<" + "!-- CORE_SUMMARY_START --" + ">";
    const endMarker = "<" + "!-- CORE_SUMMARY_END --" + ">";
    const startIndex = text.indexOf(startMarker);
    const endIndex = text.indexOf(endMarker, startIndex + startMarker.length);

    if (startIndex === -1 || endIndex === -1) {
      return { coreSummary: null, reportText: responseText };
    }

    const rawBlockEnd = endIndex + endMarker.length;
    const rawJsonBlock = text.slice(startIndex + startMarker.length, endIndex);
    const reportText = (text.slice(0, startIndex) + text.slice(rawBlockEnd)).trim();

    try {
      const rawJson = rawJsonBlock
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      const parsed = JSON.parse(rawJson);
      const normalizeText = value => String(value || "未披露").trim() || "未披露";
      const focus = Array.isArray(parsed.focus)
        ? parsed.focus.map(normalizeText).filter(Boolean).slice(0, 4)
        : [];

      return {
        coreSummary: {
          company: normalizeText(parsed.company),
          identity: normalizeText(parsed.identity),
          problem: normalizeText(parsed.problem),
          revenue: normalizeText(parsed.revenue),
          edge: normalizeText(parsed.edge),
          momentum: normalizeText(parsed.momentum),
          pressure: normalizeText(parsed.pressure),
          focus: focus.length ? focus : ["未披露"]
        },
        reportText
      };
    } catch (error) {
      console.warn("核心摘要資料解析失敗，改用純文字報告。", error);
      return { coreSummary: null, reportText: reportText.trim() };
    }
  }

  function extractProductPortfolio(responseText) {
    const text = String(responseText || "");
    const startMarker = "<" + "!-- PRODUCT_PORTFOLIO_START --" + ">";
    const endMarker = "<" + "!-- PRODUCT_PORTFOLIO_END --" + ">";
    const startIndex = text.indexOf(startMarker);
    const endIndex = text.indexOf(endMarker, startIndex + startMarker.length);

    if (startIndex === -1 || endIndex === -1) {
      return { productPortfolio: null, reportText: responseText };
    }

    const rawBlockEnd = endIndex + endMarker.length;
    const rawJsonBlock = text.slice(startIndex + startMarker.length, endIndex);
    const reportText = (text.slice(0, startIndex) + text.slice(rawBlockEnd)).trim();

    try {
      const rawJson = rawJsonBlock
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      const parsed = JSON.parse(rawJson);
      const normalizeText = value => String(value || "未披露").trim() || "未披露";
      const items = Array.isArray(parsed.items)
        ? parsed.items
            .map(item => ({
              area: normalizeText(item?.area),
              type: normalizeText(item?.type),
              examples: Array.isArray(item?.examples)
                ? item.examples.map(normalizeText)
                : ["未披露"],
              significance: normalizeText(item?.significance)
            }))
            .slice(0, 6)
        : [];

      return {
        productPortfolio: items.length
          ? { overview: normalizeText(parsed.overview), items }
          : null,
        reportText
      };
    } catch (error) {
      console.warn("產品組合資料解析失敗，改用純文字報告。", error);
      return { productPortfolio: null, reportText: reportText.trim() };
    }
  }

  function extractResearchDashboard(responseText) {
    const text = String(responseText || "");
    const startMarker = "<" + "!-- RESEARCH_DASHBOARD_START --" + ">";
    const endMarker = "<" + "!-- RESEARCH_DASHBOARD_END --" + ">";
    const startIndex = text.indexOf(startMarker);
    const endIndex = text.indexOf(endMarker, startIndex + startMarker.length);

    if (startIndex === -1 || endIndex === -1) {
      return { dashboard: null, reportText: responseText };
    }

    const rawBlockEnd = endIndex + endMarker.length;
    const rawJsonBlock = text.slice(startIndex + startMarker.length, endIndex);
    const reportText = (text.slice(0, startIndex) + text.slice(rawBlockEnd)).trim();

    try {
      const rawJson = rawJsonBlock
        .replace(/^```(?:json)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      return { dashboard: JSON.parse(rawJson), reportText };
    } catch (error) {
      console.debug("研究儀表板資料解析失敗，已略過儀表板區塊。", error);
      return { dashboard: null, reportText: reportText.trim() };
    }
  }

  function safeText(value) {
    return String(value || "未披露").trim() || "未披露";
  }

  function safeItems(value, limit = 10) {
    return Array.isArray(value) ? value.slice(0, limit) : [];
  }

  function renderDashboardHeading(eyebrow, title, description) {
    return `
      <div class="research-panel__heading">
        <span>${escapeHtml(eyebrow)}</span>
        <h2>${escapeHtml(title)}</h2>
        ${description ? `<p>${escapeHtml(description)}</p>` : ""}
      </div>
    `;
  }

  function renderInfoCards(items, className = "") {
    return `
      <div class="research-card-grid ${className}">
        ${items.map((item, index) => `
          <article class="research-card">
            <span class="research-card__number">${String(index + 1).padStart(2, "0")}</span>
            <p class="research-card__label">${escapeHtml(item.label)}</p>
            <p class="research-card__text">${escapeHtml(safeText(item.text))}</p>
          </article>
        `).join("")}
      </div>
    `;
  }

  function renderDataTable(headers, rows) {
    if (!rows.length) return `<p class="research-empty">目前資料不足以判斷</p>`;
    return `
      <div class="research-table-wrap">
        <table class="research-table">
          <thead><tr>${headers.map(header => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.map(row => `
              <tr>${row.map(cell => `<td>${escapeHtml(safeText(cell))}</td>`).join("")}</tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderResearchDashboard(dashboard, symbol) {
    if (!dashboard) return "";

    const vision = dashboard.vision || {};
    const operating = dashboard.operatingModel || {};
    const revenue = dashboard.revenueModel || {};
    const industry = dashboard.industry || {};
    const governance = dashboard.governance || {};
    const research = dashboard.research || {};

    const visionHtml = `
      <section class="research-panel research-panel--light">
        ${renderDashboardHeading("COMPANY PURPOSE", "公司願景與客戶痛點", "從公司想解決的問題，看它如何降低門檻並建立信任。")}
        ${renderSectionAskButton("公司願景與客戶痛點", vision)}
        ${renderInfoCards([
          { label: "公司想做什麼", text: vision.goal },
          { label: "傳統痛點", text: vision.pain },
          { label: "降低門檻", text: vision.access },
          { label: "信任與便利", text: vision.trust }
        ])}
      </section>
    `;

    const operatingSteps = safeItems(operating.steps, 5);

  function findJsonObjectEnd(text, startIndex) {
    let depth = 0;
    let inString = false;
    let escaped = false;

    for (let index = startIndex; index < text.length; index += 1) {
      const char = text[index];

      if (inString) {
        if (escaped) {
          escaped = false;
        } else if (char === "\\") {
          escaped = true;
        } else if (char === '"') {
          inString = false;
        }
        continue;
      }

      if (char === '"') {
        inString = true;
      } else if (char === "{") {
        depth += 1;
      } else if (char === "}") {
        depth -= 1;
        if (depth === 0) return index + 1;
      }
    }

    return -1;
  }

  function formatUnexpectedOverviewJson(data) {
    if (!data || typeof data.overview !== "string" || !Array.isArray(data.items)) {
      return null;
    }

    const sections = data.items
      .map(item => {
        const area = String(item?.area || "").trim();
        const type = String(item?.type || "").trim();
        const examples = Array.isArray(item?.examples)
          ? item.examples.map(example => String(example || "").trim()).filter(Boolean)
          : [];
        const significance = String(item?.significance || "").trim();

        if (!area && !type && !examples.length && !significance) return "";

        const title = [area, type].filter(Boolean).join("｜") || "產品與服務";
        const lines = [`### ${title}`];
        if (examples.length) lines.push(`- **代表項目：** ${examples.join("、")}`);
        if (significance) lines.push(`- **對公司的意義：** ${significance}`);
        return lines.join("\n");
      })
      .filter(Boolean);

    return [
      "## 主要產品與服務",
      data.overview.trim(),
      ...sections
    ].filter(Boolean).join("\n\n");
  }

  function normalizeUnexpectedJson(responseText) {
    let text = String(responseText || "");
    let searchIndex = 0;

    while (searchIndex < text.length) {
      const startIndex = text.indexOf("{", searchIndex);
      if (startIndex === -1) break;

      const endIndex = findJsonObjectEnd(text, startIndex);
      if (endIndex === -1) break;

      const candidate = text.slice(startIndex, endIndex);

      try {
        const parsed = JSON.parse(candidate);
        const replacement = formatUnexpectedOverviewJson(parsed);

        if (replacement) {
          text = text.slice(0, startIndex) + replacement + text.slice(endIndex);
          searchIndex = startIndex + replacement.length;
          continue;
        }
      } catch (error) {
        // This brace belongs to normal report text, so continue searching.
      }

      searchIndex = startIndex + 1;
    }

    return text
      .replace(/```json\s*(?=\{)/gi, "")
      .replace(/(\})\s*```/g, "$1")
      .trim();
  }

    const { data: profile } = await supabaseClient

  async function getWeeklyUsage(userId) {
    const startOfWeek = new Date();
    startOfWeek.setHours(0, 0, 0, 0);
    startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

    const { count, error } = await supabaseClient
      .from("usage_logs")
      .select("*", { count: 'exact', head: true })
      .eq("user_id", userId)
      .eq("action", "company_intro")
      .gte("created_at", startOfWeek.toISOString());

    return error ? 0 : count;
  }

  async function updateUsageInfo(user, plan) {
    const usageInfoEl = document.getElementById("usageInfo");
    if (!usageInfoEl) return;
    if (!user) {
      usageInfoEl.innerHTML = '目前身分：訪客｜每日 1 份報告、3 次追問。<a href="index.html?login=1" target="_blank" rel="noopener">登入取得更多免費額度</a>';
      try {
        const response = await fetch(new URL("/api/guest-usage", BACKEND_URL));
        if (!response.ok) return;
        const usage = await response.json();
        usageInfoEl.innerHTML = `目前身分：訪客｜今日報告：${Number(usage.used.company_intro)} / 1｜今日追問：${Number(usage.used.chat_query)} / 3<br><a href="index.html?login=1" target="_blank" rel="noopener">登入取得更多免費額度</a>`;
      } catch (error) {
        console.debug("訪客額度暫時無法讀取。", error);
      }
      return;
    }

    const startOfWeek = new Date();
    startOfWeek.setHours(0, 0, 0, 0);
    startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

    const limit = PLAN_LIMIT[plan] ?? PLAN_LIMIT["free"];
    const limitText = limit === Infinity ? "無限" : limit;
    
    const used = await getWeeklyUsage(user.id);

    const { count: chatUsed } = await supabaseClient
      .from("usage_logs")
      .select("*", { count: 'exact', head: true })
      .eq("user_id", user.id)
      .eq("action", "chat_query")
      .gte("created_at", startOfWeek.toISOString());

    const chatLimit = plan === 'pro' ? "無限" : 20;
    
    usageInfoEl.innerHTML = `
      目前身分：<span class="plan-tag plan-free">免費會員</span>
      ｜ 本週報告：${used} / ${limitText} 次
      <br>💬 本週對話：${chatUsed || 0} / ${chatLimit} 次
    `;
  }

  function validateCompactReport(report, format) {
    const text = value => typeof value === 'string' && value.trim().length > 0;
    if (!report?.company || !['symbol', 'overview', 'revenue', 'customers'].every(key => text(report.company[key]))) {
      throw new Error('公司報告格式不完整，請稍後再試。');
    }
    const sevenSections = format === 'compact-v2' || ['history', 'management', 'industry', 'thesis'].some(key => key in report);
    const fields = { products: ['name', 'significance'], risks: ['risk', 'reason', 'watch'] };
    if (sevenSections) {
      const sections = { history: ['milestones', 'footprint'], management: ['team', 'strategy'],
        industry: ['competition', 'advantage'], thesis: ['opportunity', 'condition'] };
      for (const [key, required] of Object.entries(sections)) {
        if (!report[key] || !required.every(field => text(report[key][field]))) {
          throw new Error('公司報告部分章節未完整傳回，請稍後再試。');
        }
      }
    } else {
      fields.growth = ['driver', 'reason', 'watch'];
      fields.financialWatch = ['metric', 'importance', 'watch'];
    }
    for (const [key, required] of Object.entries(fields)) {
      if (!Array.isArray(report[key]) || !report[key].length || !report[key].every(item =>
        item && required.every(field => text(item[field])) && (key !== 'products' ||
          (Array.isArray(item.examples) && item.examples.length && item.examples.every(text))))) {
        throw new Error('公司報告部分章節未完整傳回，請稍後再試。');
      }
    }
    return report;
  }

      <tbody>${rows.map(row => `<tr>${row.map((cell, i) => `<${i ? 'td' : 'th scope="row"'}>${escapeHtml(available(cell) ? cell : '')}</${i ? 'td' : 'th'}>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
    const flow = [ ['付費客戶', company.customers], ['產品與服務', products.filter(p => available(p.name)).map(p => p.name).join('、')],

      .map(p => [p.name, p.examples.filter(available).join('、'), p.significance]);
    const historyRows = [['發展轉折', history.milestones], ['營運布局', history.footprint]].filter(([, v]) => available(v));
    const managementRows = [['經營團隊', management.team], ['策略方向', management.strategy]].filter(([, v]) => available(v));

    const thesisRows = [['研究論點', thesis.opportunity], ['驗證條件與反證', thesis.condition]].filter(([, v]) => available(v));
    const riskRows = risks.filter(r => available(r.risk) && available(r.reason)).map(r => [r.risk, r.reason, r.watch]);
    const sections = [

    ].filter(([, , , body]) => body);
    return `<div class="brief-layout"><nav class="brief-toc" aria-label="報告章節"><span>CONTENTS</span>

        <h2>${escapeHtml(company.symbol || symbol)}</h2><p>看懂生意，理解機會與風險。</p></header>
      ${sections.map(([id, english, title, body, context, hidden], i) => `<article id="brief-${id}" class="quick-topic brief-chapter"${id === 'segments' ? ' data-segment-chapter' : ''}${hidden ? ' hidden' : ''}>

      return renderCompactReport(sections.compactReport, symbol) + renderReadingChapter('股價走勢', symbol, chartHtml);

    const { valueChain, timeline, coreSummary, productPortfolio, dashboard, reportText } = sections;
    const fullReportHtml = renderReadingChapter('股價走勢', symbol, chartHtml) +
      renderReadingChapter('商業模式與產業價值鏈', valueChain?.position, renderValueChain(valueChain, symbol)) +
      renderReadingChapter('公司發展時間線', timeline?.items?.[0]?.event, renderTimeline(timeline)) +
      renderReadingChapter('完整核心摘要', coreSummary?.identity, renderCoreSummary(coreSummary, symbol)) +
      renderReadingChapter('主要產品與服務', productPortfolio?.overview, renderProductPortfolio(productPortfolio)) +
      renderResearchDashboard(dashboard, symbol) + marked.parse(reportText);
    return renderQuickOverview(coreSummary, dashboard, valueChain, symbol, productPortfolio) +
      renderRevenuePlaceholder() +
      renderReadingChapter('深入閱讀', '展開舊版完整分析', fullReportHtml);
  }

  function readCompanySections(data) {
    if (data.report && (['compact-v1', 'compact-v2'].includes(data.reportFormat) || data.report.company)) {
      return { compactReport: validateCompactReport(data.report, data.reportFormat), reportText: '' };
    }
    const compactStart = '<!-- COMPACT_REPORT_START -->';
    if (!data.report && typeof data.text === 'string' && data.text.includes(compactStart)) {
      const start = data.text.indexOf(compactStart) + compactStart.length;
      const end = data.text.indexOf('<!-- COMPACT_REPORT_END -->', start);
      if (end < 0) throw new Error('公司報告部分章節未完整傳回，請稍後再試。');
      let parsed;
      try { parsed = JSON.parse(data.text.slice(start, end).trim()); }
      catch { throw new Error('公司報告格式不完整，請稍後再試。'); }
      return { compactReport: validateCompactReport(parsed), reportText: '' };
    }
    if (data.report) {
      const { valueChain, timeline, coreSummary, productPortfolio, dashboard } = data.report;
      if (!valueChain || !timeline || !coreSummary || !productPortfolio || !dashboard) {
        throw new Error("公司報告格式不完整，請稍後再試。");
      }
      return { valueChain, timeline, coreSummary, productPortfolio, dashboard, reportText: "" };
    }
    // Allow older deployed API responses during a rolling deployment.
    const { valueChain, reportText: a } = extractValueChain(data.text);
    const { timeline, reportText: b } = extractTimeline(a);
    const { coreSummary, reportText: c } = extractCoreSummary(b);
    const { productPortfolio, reportText: d } = extractProductPortfolio(c);
    const { dashboard, reportText } = extractResearchDashboard(d);
    if (!valueChain || !timeline || !coreSummary || !productPortfolio || !dashboard) {
      throw new Error("公司報告部分章節未完整傳回，請稍後再試。");
    }
    return { valueChain, timeline, coreSummary, productPortfolio, dashboard, reportText: normalizeUnexpectedJson(reportText) };
  }

      stopAdoptionCard();
    
      fetchBtn.disabled = false;
      fetchBtn.textContent = "產生公司介紹";
    }
  });

  document.addEventListener("click", event => {
    const askButton = event.target.closest(".section-ai-btn");
    if (!askButton) return;

    const sectionData = sectionContextRegistry[askButton.dataset.sectionId];
    if (!sectionData) return;

    activeSectionContext = sectionData;
    document.getElementById("chatContainer").style.display = "block";
    document.getElementById("chatContextBadge").textContent = `目前聚焦：${sectionData.title}`;
    document.getElementById("chatInput").placeholder = `針對「${sectionData.title}」提問...`;
    document.getElementById("chatInput").focus();
    document.getElementById("chatContainer").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.getElementById("sendChatBtn").addEventListener("click", async () => {
    const chatInput = document.getElementById("chatInput");
    const chatHistory = document.getElementById("chatHistory");
    const userQuery = chatInput.value.trim();

    if (!userQuery) return;

    chatHistory.innerHTML += `<div style="margin-bottom:10px; color:#fff;"><strong>👤 您：</strong>${escapeHtml(userQuery)}</div>`;
    chatInput.value = "";

    const aiMsgId = "ai-" + Date.now();
    chatHistory.innerHTML += `
      <div style="margin-bottom:20px; padding-left:10px; border-left:3px solid #8b5cf6; color:#ede7f3;">
        <strong>🤖 AI：</strong><br><span id="${aiMsgId}">正在思考中...</span>
      </div>
    `;
    const aiDisplayEl = document.getElementById(aiMsgId);
    chatHistory.scrollTop = chatHistory.scrollHeight;

    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      const response = await fetch("https://dongcaibao.onrender.com/api/chat-with-report", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(session ? { "Authorization": `Bearer ${session.access_token}` } : {})
        },
        body: JSON.stringify({
          symbol: currentSymbol,
          searchContext: currentSearchContext,
          sectionTitle: activeSectionContext?.title || "整份公司報告",
          sectionContext: activeSectionContext?.context || "",
          userQuery: userQuery
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        if (errorData.loginRequired) showPlanModal(errorData.error, true);
        throw new Error(errorData.error || "對話失敗");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullContent = "";
      aiDisplayEl.innerHTML = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        fullContent += chunk;
        
        aiDisplayEl.innerHTML = marked.parse(fullContent);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      const { user, plan } = await getCurrentUserPlan();
      await updateUsageInfo(user, plan);

    } catch (err) {
      console.error(err);
      aiDisplayEl.innerHTML = `<span style="color:red;">錯誤：${escapeHtml(err.message)}</span>`;
    }
  });
</script>
</body>
</html>
