<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>懂才抱．股票資訊整合系統</title>

  <meta name="description" content="客製化的股票資訊整合平台">
  <meta name="keyword" content="股票,財報狗,資訊整合平台">

  <link rel="stylesheet" href="css/background_integration.css">

<body>
  <h1>輸入股票代碼</h1>

  <input id="symbolInput" type="text" placeholder="例如：HIMS 或 NVDA" />
  <button id="fetchBtn">產生公司介紹</button>

  <p id="usageInfo"></p>
  <p id="debug"></p>

  <div id="result"></div>
  <div id="planModal" class="dc-modal">
    <div class="dc-modal-backdrop" id="planModalBackdrop"></div>
    <div class="dc-modal-content">
      <h3>使用額度提醒</h3>
      <p id="planModalMessage"></p>
      <div class="dc-modal-actions">
        <a id="guestLoginLink" href="index.html?login=1" target="_blank" rel="noopener" hidden>登入／免費註冊</a>
        <button id="planModalClose" class="dc-btn-primary">知道了</button>
      </div>
    </div>
  </div>

  <script>
(() => {
  const COLORS = ['#103f66', '#ee8c78', '#6cadd3', '#edbd68', '#9bb4b9', '#687f9b', '#b9a78d', '#7e9c89'];
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  const percent = share => `${(share * 100).toLocaleString('zh-TW', { maximumFractionDigits: 1 })}%`;
  const amount = (value, currency) => `${new Intl.NumberFormat('zh-TW', {
    notation: 'compact', maximumFractionDigits: 2
  }).format(value)} ${escape(currency)}`;

  function pie(items) {
    let angle = -Math.PI / 2;
    const slices = items.map((item, index) => {
      const color = COLORS[index % COLORS.length];
      const title = `<title>${escape(item.name)}：${percent(item.share)}</title>`;
      if (items.length === 1) return `<circle cx="120" cy="120" r="108" fill="${color}">${title}</circle>`;
      const start = [120 + 108 * Math.cos(angle), 120 + 108 * Math.sin(angle)];
      angle += item.share * Math.PI * 2;
      const end = [120 + 108 * Math.cos(angle), 120 + 108 * Math.sin(angle)];
      return `<path d="M120 120 L${start.join(' ')} A108 108 0 ${item.share > 0.5 ? 1 : 0} 1 ${end.join(' ')} Z"
        fill="${color}" stroke="white" stroke-width="1.5">${title}</path>`;
    }).join('');
    return `<svg class="revenue-pie" viewBox="0 0 240 240" role="img" aria-label="產品營收圓餅圖，詳細數字見下方表格">${slices}</svg>`;
  }

  function card(data, kind, insight) {
    const product = kind === 'product';
    const title = product ? '業務／產品營收組成' : '地區營收分布';
    if (data?.status !== 'ok' || !Array.isArray(data.items) || !data.items.length) return '';
    const reading = typeof insight === 'string' && insight.trim()
      && !/^(未披露|未提供|資料不足|目前資料不足|目前無法)/.test(insight.trim()) ? insight : '';
    const rows = data.items.map((item, index) => `<tr><th scope="row">
      <span class="revenue-swatch" style="background:${COLORS[index % COLORS.length]}"></span>${escape(item.name)}</th>
      <td title="${escape(item.value.toLocaleString('zh-TW'))} ${escape(data.currency)}">${amount(item.value, data.currency)}</td>
      <td>${percent(item.share)}</td></tr>`).join('');
    const graphic = product ? pie(data.items) : `<div class="revenue-bars" aria-hidden="true">${data.items.map((item, index) =>
      `<div class="revenue-bar-row"><div><span>${escape(item.name)}</span><b>${percent(item.share)}</b></div>
      <div class="revenue-bar-track"><span style="width:${item.share * 100}%;background:${COLORS[index % COLORS.length]}"></span></div></div>`).join('')}</div>`;
    return `<article class="revenue-card"><h4>${title}</h4>
      <p class="revenue-period">FY ${escape(data.fiscalYear)}｜年度截至 ${escape(data.date)}｜${escape(data.currency)}</p>
      ${graphic}<div class="revenue-table-scroll"><table><caption>${title}明細</caption>
      <thead><tr><th scope="col">${product ? '產品／業務' : '地區'}</th><th scope="col">營收</th><th scope="col">占比</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${reading ? `<div class="revenue-reading"><strong>${product ? '產品組合解讀' : '地區分布解讀'}</strong><p>${escape(reading)}</p></div>` : ''}</article>`;
  }

  window.renderPeerComparison = (snapshot, insight, qualitative) => {
    const available = value => typeof value === 'string' && value.trim()
      && !/^(未披露|未提供|未公開|不適用|無資料|資料不足|目前資料不足|目前無法|暫無|無法確認|尚未披露)/.test(value.trim());
    const items = Array.isArray(snapshot?.items) ? snapshot.items : [];
    const chart = (key, title, unit) => {
      if (snapshot?.status !== 'ok') return '';
      const rows = items.filter(item => item && typeof item[key] === 'number' && Number.isFinite(item[key])
        && (key !== 'peRatio' || item[key] > 0));
      if (!rows.some(item => item.isTarget) || !rows.some(item => !item.isTarget)) return '';
      const scale = Math.max(1, ...rows.map(item => Math.abs(item[key])));
      const low = Math.min(0, ...rows.map(item => item[key] / scale));
      const high = Math.max(0, ...rows.map(item => item[key] / scale));
      const range = high - low || 1;
      const position = value => 1 + (value / scale - low) / range * 98;
      const zero = position(0);
      return `<article class="revenue-card peer-chart"><h4>${title}</h4><div class="revenue-bars">
        ${rows.map(item => {
          const value = item[key], end = position(value);
          const label = `${item.companyName || item.ticker} (${item.ticker})`;
          const formatted = `${value.toLocaleString('zh-TW', { maximumFractionDigits: 1 })}${unit}`;
          return `<div class="revenue-bar-row${item.isTarget ? ' peer-target' : ''}"><div><span>${escape(label)}${item.isTarget ? ' · 本公司' : ''}</span><b>${escape(formatted)}</b></div>
            ${key === 'operatingMargin' && ['income_statement_ttm', 'four_quarters'].includes(item.operatingMarginSource)
              ? `<small class="peer-calculated">TTM 損益表計算${/^\d{4}-\d{2}-\d{2}$/.test(item.operatingMarginPeriodEnd || '') ? ` · 截至 ${escape(item.operatingMarginPeriodEnd)}` : ''}</small>` : ''}
            <svg viewBox="0 0 100 16" preserveAspectRatio="none" role="img" aria-label="${escape(label)}：${escape(formatted)}">
              <rect x="${Math.min(zero, end)}" y="2" width="${Math.abs(end - zero)}" height="12" rx="1" fill="${item.isTarget ? COLORS[0] : '#c6cdd6'}" />
              <line x1="${zero}" x2="${zero}" y1="0" y2="16" stroke="#8291a3" stroke-width="0.4" /></svg></div>`;
        }).join('')}</div></article>`;
    };
    const cards = [chart('operatingMargin', '營業利益率對照（TTM）', '%'), chart('peRatio', '本益比估值對照（P/E TTM）', ' 倍')].filter(Boolean);
    const peers = Array.isArray(qualitative?.peers) ? qualitative.peers.filter(item => item && available(item.company)
      && (available(item.position) || available(item.difference))) : [];
    const qualitativeBody = cards.length < 2 && qualitative
      ? `${available(qualitative.overview) ? `<p class="brief-prose">${escape(qualitative.overview)}</p>` : ''}
        ${peers.length ? `<div class="brief-table-wrap"><table class="brief-table"><thead><tr><th scope="col">同業</th><th scope="col">產品與客群定位</th><th scope="col">競爭差異</th></tr></thead>
        <tbody>${peers.map(item => `<tr><th scope="row">${escape(item.company)}</th><td>${escape(available(item.position) ? item.position : '')}</td><td>${escape(available(item.difference) ? item.difference : '')}</td></tr>`).join('')}</tbody></table></div>` : ''}
        ${available(qualitative.watch) ? `<div class="revenue-reading"><strong>觀察重點</strong><p>${escape(qualitative.watch)}</p></div>` : ''}`.trim()
      : '';
    if (!cards.length && !qualitativeBody) return '';
    const reading = available(insight) ? insight.split(/\r?\n/)
      .map(line => line.trim().replace(/^(?:[-*]\s+|[•●]\s*|\d+[.)、]\s+)/u, ''))
      .filter(Boolean).join(' ').replace(/\s+/g, ' ').trim() : '';
    return `<div class="peer-comparison">${cards.length ? `<div class="revenue-grid${cards.length === 1 ? ' revenue-grid--single' : ''}">${cards.join('')}</div>` : ''}
      ${cards.length && reading ? `<div class="revenue-reading"><p>${escape(reading)}</p></div>` : ''}
      ${qualitativeBody ? `<div class="peer-qualitative"><h4>競爭定位與差異</h4>${qualitativeBody}</div>` : ''}
      ${cards.length ? `<p class="revenue-note">來源：<a href="https://financialmodelingprep.com/" target="_blank" rel="noopener noreferrer">Financial Modeling Prep</a>。
      ${snapshot.retrievedAt && Number.isFinite(Date.parse(snapshot.retrievedAt)) ? `資料擷取：${escape(new Date(snapshot.retrievedAt).toLocaleDateString('zh-TW'))}。` : ''}</p>` : ''}</div>`;
  };

  window.renderValuationSnapshot = snapshot => {
    if (!snapshot || typeof snapshot !== 'object') return '';
    const positive = value => typeof value === 'number' && Number.isFinite(value) && value > 0;
    const multiple = value => `${value.toLocaleString('zh-TW', { maximumFractionDigits: 1 })} 倍`;
    const cards = [];
    if (positive(snapshot.marketCap) && /^[A-Z]{3}$/.test(snapshot.currency || '')) {
      cards.push(['市值', new Intl.NumberFormat('zh-TW', { style: 'currency', currency: snapshot.currency,
        currencyDisplay: 'code', notation: 'compact', maximumFractionDigits: 2 }).format(snapshot.marketCap)]);
    }
    if (positive(snapshot.peRatio)) cards.push(['P/E（TTM）', multiple(snapshot.peRatio)]);
    if (positive(snapshot.evToEbitda)) cards.push(['EV/EBITDA（TTM）', multiple(snapshot.evToEbitda)]);
    if (typeof snapshot.fcfYield === 'number' && Number.isFinite(snapshot.fcfYield)) {
      cards.push(['自由現金流收益率', `${snapshot.fcfYield.toLocaleString('zh-TW', { maximumFractionDigits: 2 })}%`]);
    }
    if (!cards.length) return '';
    return `<div class="thesis-valuation-grid" aria-label="估值快照">${cards.map(([label, value]) =>
      `<dl class="thesis-valuation-card"><dt>${escape(label)}</dt><dd>${escape(value)}</dd></dl>`).join('')}</div>
      <p class="revenue-note">來源：<a href="https://financialmodelingprep.com/" target="_blank" rel="noopener noreferrer">Financial Modeling Prep</a>。
      ${snapshot.retrievedAt && Number.isFinite(Date.parse(snapshot.retrievedAt)) ? `資料擷取：${escape(new Date(snapshot.retrievedAt).toLocaleDateString('zh-TW'))}。` : ''}</p>`;
  };

  window.loadRevenueCharts = async (container, backendUrl, symbol, snapshot, insights = {}) => {
    if (!container) return;
    const section = container.closest('.revenue-section');
    section.hidden = true;
    if (/^\d{4}(\.TW|\.TWO)?$/i.test(symbol)) {
      return;
    }
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      let data = snapshot;
      if (!data) {
        const url = new URL('/api/fmp/revenue-segmentation', backendUrl);
        url.searchParams.set('symbol', symbol);
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error('Revenue data unavailable');
        data = await response.json();
      }
      if (!container.isConnected) return;
      const cards = [card(data.product, 'product', insights.product), card(data.geographic, 'geographic', insights.geographic)].filter(Boolean);
      if (!cards.length) return;
      container.innerHTML = `<div class="revenue-grid${cards.length === 1 ? ' revenue-grid--single' : ''}">${cards.join('')}</div>
        <p class="revenue-note">來源：<a href="https://financialmodelingprep.com/" target="_blank" rel="noopener noreferrer">Financial Modeling Prep</a>。
        各圖年度見標示；占比依已披露分項合計計算，未與總營收核對，分類可能重疊。</p>`;
      section.hidden = false;
      const chapter = section.closest('[data-segment-chapter]');
      if (chapter) {
        chapter.hidden = false;
        const link = document.querySelector('[data-report-link="segments"]');
        if (link) link.hidden = false;
      }
    } catch {
      // Optional charts fail silently; the generated report remains readable.
    } finally {
      clearTimeout(timeout);
    }
  };
})();
  const BACKEND_URL = "https://dongcaibao.onrender.com/api/analyze-stock";

  const supabaseUrl = "https://zlkexplsleznuebighte.supabase.co";
  const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
  
  const PLAN_LIMIT = {
    free: 10,
    plus: 10,
    pro: Infinity
  };

  const planModal = document.getElementById("planModal");
  const planModalBackdrop = document.getElementById("planModalBackdrop");
  const planModalClose = document.getElementById("planModalClose");
  const planModalMessage = document.getElementById("planModalMessage");

  function showPlanModal(message, loginRequired = false) {
    document.getElementById("guestLoginLink").hidden = !loginRequired;
    planModalMessage.textContent = message;
    planModal.classList.add("show");
  }

  function hidePlanModal() {
    planModal.classList.remove("show");
  }

  planModalClose.addEventListener("click", hidePlanModal);
  planModalBackdrop.addEventListener("click", hidePlanModal);

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function startAdoptionCard(container) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    const officialUrl = 'https://www.pet.gov.tw/AnimalApp/AnnounceMent.aspx?PageType=Adopt';
    const sourceUrl = 'https://data.gov.tw/dataset/85903';
    const render = data => {
      if (!container.isConnected) return;
      const animal = data?.animal;
      let photo = '';
      try {
        const url = new URL(animal?.photo);
        if (url.protocol === 'https:' && url.hostname.endsWith('.gov.tw') && !url.username && !url.password) photo = url.href;
      } catch { /* Missing photos use the text-only card. */ }
      container.innerHTML = `
        <article class="adoption-card${photo ? ' adoption-card-with-photo' : ''}" aria-label="公益認養資訊">
          ${photo ? `<div class="adoption-card-photo"><img src="${escapeHtml(photo)}" alt="待認養${escapeHtml(animal.kind)}的收容照片" referrerpolicy="no-referrer"></div>` : ''}
          <div class="adoption-card-body">
            <span class="adoption-card-label">公益認養資訊 · 非商業廣告</span>
            <h2>你在等一份報告，牠在等一個家。</h2>
            <p>等待的空檔，認識一位正在找家的小夥伴。認養前，請先評估長期照顧的責任。</p>
            ${animal ? `<dl>
              <div><dt>動物</dt><dd>${escapeHtml(animal.kind)}${animal.variety ? ` · ${escapeHtml(animal.variety)}` : ''}</dd></div>
              <div><dt>收容所</dt><dd>${escapeHtml(animal.shelter)}</dd></div>
              ${animal.location && animal.location !== animal.shelter ? `<div><dt>所在地</dt><dd>${escapeHtml(animal.location)}</dd></div>` : ''}
              ${animal.reference ? `<div><dt>收容編號</dt><dd>${escapeHtml(animal.reference)}</dd></div>` : ''}
            </dl>` : '<p>前往官方平台，查看各地待認養動物的最新資訊。</p>'}
            <a class="adoption-card-link" href="${officialUrl}" target="_blank" rel="noopener noreferrer">前往官方認養平台 ↗</a>
            <small>資料來源：<a href="${sourceUrl}" target="_blank" rel="noopener noreferrer">農業部動物認領養開放資料</a>（政府資料開放授權條款第 1 版）。非政府合作或背書。
              ${animal?.sourceUpdatedAt ? `<br>來源更新：${escapeHtml(animal.sourceUpdatedAt)}` : ''}
              ${data?.fetchedAt ? `<br>本站擷取：${escapeHtml(new Date(data.fetchedAt).toLocaleString('zh-TW'))}` : ''}
              <br>實際認養狀態以收容所確認為準。連結另開分頁，不影響報告生成。
            </small>
          </div>
        </article>`;
      const image = container.querySelector('img');
      if (image) image.addEventListener('error', () => {
        container.querySelector('article').classList.remove('adoption-card-with-photo');
        image.parentElement.remove();
      }, { once: true });
    };
    render(null);
    fetch(new URL('/api/adoption-card', BACKEND_URL), { signal: controller.signal })
      .then(response => {
        if (!response.ok) throw new Error('Adoption information unavailable');
        return response.json();
      })
      .then(data => { if (!controller.signal.aborted) render(data); })
      .catch(() => {})
      .finally(() => clearTimeout(timeout));
    return () => { clearTimeout(timeout); controller.abort(); };
  }


  function renderReadingChapter(title, preview, content) {
    if (!content) return "";
    return `<details class="reading-chapter">
      <summary><span class="reading-chapter__title">${escapeHtml(title)}</span>
        <span class="reading-chapter__preview">${escapeHtml(String(preview || '').trim())}</span>
        <span class="reading-chapter__toggle" aria-hidden="true">+</span>
      </summary>
      <div class="reading-chapter__body">${content}</div>
    </details>`;
  }


  async function getCurrentUserPlan() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user || user.is_anonymous) return { user: null, plan: "guest" };

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("plan")
      .eq("id", user.id)
      .maybeSingle();

    return { user, plan: profile?.plan || "free" };
  }

  async function getWeeklyUsage(userId) {
    const startOfWeek = new Date();
    startOfWeek.setHours(0, 0, 0, 0);
    startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

    const { count, error } = await supabaseClient
      .from("usage_logs")
      .select("*", { count: 'exact', head: true })
      .eq("user_id", userId)
      .eq("action", "company_intro")
      .gte("created_at", startOfWeek.toISOString());

    return error ? 0 : count;
  }

  async function updateUsageInfo(user, plan) {
    const usageInfoEl = document.getElementById("usageInfo");
    if (!usageInfoEl) return;
    if (!user) {
      usageInfoEl.innerHTML = '目前身分：訪客｜每日 1 份報告。<a href="index.html?login=1" target="_blank" rel="noopener">登入取得更多免費額度</a>';
      try {
        const response = await fetch(new URL("/api/guest-usage", BACKEND_URL));
        if (!response.ok) return;
        const usage = await response.json();
        usageInfoEl.innerHTML = `目前身分：訪客｜今日報告：${Number(usage.used.company_intro)} / 1<br><a href="index.html?login=1" target="_blank" rel="noopener">登入取得更多免費額度</a>`;
      } catch (error) {
        console.debug("訪客額度暫時無法讀取。", error);
      }
      return;
    }

    const limit = PLAN_LIMIT[plan] ?? PLAN_LIMIT["free"];
    const limitText = limit === Infinity ? "無限" : limit;
    
    const used = await getWeeklyUsage(user.id);

    usageInfoEl.innerHTML = `
      目前身分：<span class="plan-tag plan-free">免費會員</span>
      ｜ 本週報告：${used} / ${limitText} 次
    `;
  }

  window.addEventListener("DOMContentLoaded", async () => {
    const { user, plan } = await getCurrentUserPlan();
    await updateUsageInfo(user, plan);
  });
  supabaseClient.auth.onAuthStateChange(() => {
    setTimeout(async () => {
      const { user, plan } = await getCurrentUserPlan();
      await updateUsageInfo(user, plan);
    }, 0);
  });

  function isTaiwanStock(symbol) {
    const value = String(symbol || "").trim().toUpperCase();
    return /^\d{4}(\.TW|\.TWO)?$/.test(value);
  }

  function validateCompactReport(report, format) {
    const text = value => typeof value === 'string' && value.trim().length > 0;
    if (!report?.company || !['symbol', 'overview', 'revenue', 'customers'].every(key => text(report.company[key]))) {
      throw new Error('公司報告格式不完整，請稍後再試。');
    }
    const expandedBusiness = ['compact-v4', 'compact-v5'].includes(format) || Object.hasOwn(report.company, 'process');
    if ((format === 'compact-v5' || Object.hasOwn(report, 'segmentInsights'))
        && (!report.segmentInsights || !['product', 'geographic'].every(key => text(report.segmentInsights[key])))) {
      throw new Error('營收結構解讀未完整傳回，請稍後再試。');
    }
    if (expandedBusiness && (!Array.isArray(report.company.process) || !report.company.process.length
        || !report.company.process.every(step => step && text(step.stage) && text(step.description))
        || !text(report.company.profitCapture) || !text(report.company.defensibility)
        || !report.company.pricing || !['model', 'recognition', 'channels'].every(key => text(report.company.pricing[key])))) {
      throw new Error('公司運作章節未完整傳回，請稍後再試。');
    }
    if (!report.history || !report.management || !report.industry || !report.thesis) {
      throw new Error('公司報告部分章節未完整傳回，請稍後再試。');
    }
    const fmpOnlySegments = ['compact-v3', 'compact-v4', 'compact-v5'].includes(format) || !Object.hasOwn(report, 'products');
    const structuredRisks = report.risks && !Array.isArray(report.risks);
    const fields = structuredRisks ? {} : { risks: ['risk', 'reason', 'watch'] };
    if (structuredRisks && (!Array.isArray(report.risks.matrix) || !report.risks.matrix.length
        || !report.risks.matrix.every(item => item && ['dimension', 'impact', 'probability', 'watch'].every(key => text(item[key])))
        || !Array.isArray(report.risks.cascade) || !report.risks.cascade.length || !report.risks.cascade.every(text)
        || !Array.isArray(report.risks.catalysts) || !report.risks.catalysts.length
        || !report.risks.catalysts.every(item => item && ['event', 'timing', 'status', 'watch'].every(key => text(item[key]))))) {
      throw new Error('風險與催化劑章節未完整傳回，請稍後再試。');
    }
    if (!fmpOnlySegments) fields.products = ['name', 'significance'];
    const structuredHistory = report.history && Object.hasOwn(report.history, 'summary');
    if (structuredHistory && (!text(report.history.summary)
        || !Array.isArray(report.history.milestones) || !report.history.milestones.length
        || !report.history.milestones.every(item => item && ['year', 'event', 'significance'].every(key => text(item[key])))
        || !report.history.footprint || !['research', 'manufacturing', 'sales'].every(key => text(report.history.footprint[key])))) {
      throw new Error('歷史與足跡章節未完整傳回，請稍後再試。');
    }
    const structuredManagement = report.management && Object.hasOwn(report.management, 'leadership');
    if (structuredManagement && (!text(report.management.leadership)
        || !Array.isArray(report.management.pillars) || !report.management.pillars.length
        || !report.management.pillars.every(item => item && ['pillar', 'objective', 'initiatives'].every(key => text(item[key])))
        || !Array.isArray(report.management.capitalAllocation) || !report.management.capitalAllocation.length
        || !report.management.capitalAllocation.every(text))) {
      throw new Error('團隊與策略章節未完整傳回，請稍後再試。');
    }
    if (report.industry && Object.hasOwn(report.industry, 'qualitative')) {
      const qualitative = report.industry.qualitative;
      if (!qualitative || !text(qualitative.overview) || !text(qualitative.watch)
          || !Array.isArray(qualitative.peers) || !qualitative.peers.length
          || !qualitative.peers.every(item => item && ['company', 'position', 'difference'].every(key => text(item[key])))) {
        throw new Error('同業競爭對照未完整傳回，請稍後再試。');
      }
    }
    const structuredThesis = report.thesis && Object.hasOwn(report.thesis, 'matrix');
    if (structuredThesis && (!text(report.thesis.reading)
        || !Array.isArray(report.thesis.matrix) || !report.thesis.matrix.length
        || !report.thesis.matrix.every(item => item && ['dimension', 'bull', 'bear'].every(key => text(item[key]))))) {
      throw new Error('核心研究論點未完整傳回，請稍後再試。');
    }
    const sections = { history: structuredHistory ? ['summary'] : ['milestones', 'footprint'],
      management: structuredManagement ? ['leadership'] : ['team', 'strategy'],
      industry: Object.hasOwn(report.industry || {}, 'peerInsight') ? ['peerInsight'] : ['competition', 'advantage'],
      thesis: structuredThesis ? ['reading'] : ['opportunity', 'condition'] };
    for (const [key, required] of Object.entries(sections)) {
      if (!report[key] || !required.every(field => text(report[key][field]))) {
        throw new Error('公司報告部分章節未完整傳回，請稍後再試。');
      }
    }
    for (const [key, required] of Object.entries(fields)) {
      if (!Array.isArray(report[key]) || !report[key].length || !report[key].every(item =>
        item && required.every(field => text(item[field])) && (key !== 'products' ||
          (Array.isArray(item.examples) && item.examples.length && item.examples.every(text))))) {
        throw new Error('公司報告部分章節未完整傳回，請稍後再試。');
      }
    }
    return report;
  }

  function collectReportSources(data) {
    const unique = new Map();
    const domainTitle = title => /^(?:https?:\/\/)?(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}\/?$/i.test(title)
      && !/\.(pdf|html?|aspx?)\/?$/i.test(title);
    const documentTitle = title => !!title && !domainTitle(title) && !/^https?:\/\/\S+$/i.test(title);
    for (const source of Array.isArray(data?.grounding?.sources) ? data.grounding.sources : []) {
      try {
        const url = new URL(source?.url);
        if (url.protocol !== 'https:' || url.username || url.password) continue;
        if (!/^#!?\//.test(url.hash)) url.hash = '';
        for (const key of [...url.searchParams.keys()]) {
          if (/^utm_/i.test(key) || /^(gclid|fbclid)$/i.test(key)) url.searchParams.delete(key);
        }
        const title = typeof source.title === 'string' ? source.title.trim() : '';
        const previous = unique.get(url.href);
        const published = typeof source.publishedAt === 'string' ? source.publishedAt : source.publishedDate;
        const date = typeof published === 'string' ? published.slice(0, 10) : '';
        const publishedDate = /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(Date.parse(date))
          && new Date(date).toISOString().slice(0, 10) === date && Date.parse(date) <= Date.now() ? date : '';
        unique.set(url.href, { url, title: documentTitle(previous?.title) ? previous.title : title || previous?.title || '',
          retrieved: !!source.retrieved || !!previous?.retrieved, publishedDate: publishedDate || previous?.publishedDate || '' });
      } catch { /* Ignore malformed source URLs, not the rest of the report. */ }
    }
    const groups = new Map();
    for (const source of unique.values()) {
      const redirect = source.url.hostname === 'vertexaisearch.cloud.google.com'
        && source.url.pathname.startsWith('/grounding-api-redirect/');
      const site = (redirect && domainTitle(source.title) ? source.title.replace(/^https?:\/\//i, '').replace(/\/$/, '') : source.url.hostname).replace(/^www\./i, '').toLowerCase();
      // Opaque search redirects do not reveal a document title or its final path.
      const groupKey = redirect && !domainTitle(source.title) ? source.url.href : site;
      if (!groups.has(groupKey)) groups.set(groupKey, { site: redirect && !domainTitle(source.title) ? '搜尋來源' : site, documents: [] });
      let path = '';
      if (!redirect && source.url.pathname !== '/') {
        try { path = decodeURIComponent(source.url.pathname); } catch { path = source.url.pathname; }
      }
      const title = documentTitle(source.title) ? source.title : '';
      groups.get(groupKey).documents.push({ url: source.url.href, title, path,
        retrieved: source.retrieved, publishedDate: source.publishedDate });
    }
    return { groups: [...groups.values()], documentCount: unique.size };
  }

  function describeReportSource(source, site, index) {
    const filename = (source.path || '').split('/').filter(Boolean).pop() || '';
    const readableFilename = filename.replace(/\.(pdf|html?|aspx?)$/i, '').replace(/[_-]+/g, ' ')
      .replace(/([a-z])([A-Z])/g, '$1 $2').replace(/(\d)([A-Z][a-z])/g, '$1 $2')
      .replace(/\bQ([1-4])(?=\d{4}\b)/g, 'Q$1 ').trim();
    const opaque = /^[a-f\d-]{20,}$/i.test(filename.replace(/\.[^.]+$/, ''));
    const title = source.title || (!opaque && readableFilename ? readableFilename : `${site}｜參考文件 ${index + 1}`);
    const evidence = `${source.title || ''} ${source.path || ''}`;
    let type = /\.pdf(?:\b|$)/i.test(evidence) ? 'PDF 文件' : '網頁資料';
    if (/\b(?:10[- ]?K|20[- ]?F)\b|annual[ _-]*report|年報/i.test(evidence)) type = '年報／年度申報';
    else if (/\b10[- ]?Q\b|季度申報/i.test(evidence)) type = '季度申報文件';
    else if (/\b8[- ]?K\b/i.test(evidence)) type = '重大事件申報';
    else if (/transcript|逐字稿/i.test(evidence)) type = '法說會逐字稿';
    else if (/earnings[ _-]*call|財報電話會議|法說會/i.test(evidence)) type = '法說會資料';
    else if (/results|earnings[ _-]*release|業績|財報公告/i.test(evidence)) type = '業績公告';
    else if (/press[ _-]*release|新聞稿/i.test(evidence)) type = '新聞稿';
    else if (/leadership|governance|公司治理|領導團隊/i.test(evidence)) type = '團隊與公司治理';
    return { title, type, publisher: /(^|\.)sec\.gov$/i.test(site) ? 'SEC EDGAR' : site };
  }

  function renderReportSources(data) {
    const { groups, documentCount } = collectReportSources(data);
    const widget = typeof data?.grounding?.searchEntryPointHtml === 'string' ? data.grounding.searchEntryPointHtml : '';
    if (!documentCount && !widget) return '';
    let number = 0;
    return `<aside id="report-sources" class="report-sources" aria-label="搜尋與參考來源">
      ${documentCount ? `<header class="report-source-heading"><h2>研究來源</h2><span>${documentCount} 份文件 · ${groups.length} 個網站／來源</span></header>
        <ol class="report-source-catalog">${groups.flatMap(group => group.documents.map(source => {
          const index = number++;
          const description = describeReportSource(source, group.site, index);
          return `<li><span class="report-source-number" aria-hidden="true">${index + 1}</span><div class="report-source-content">
            <a class="report-source-title" href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(description.title)}</a>
            <div class="report-source-meta"><span>${escapeHtml(description.type)}</span><span>${escapeHtml(description.publisher)}</span>
              <span>${source.retrieved ? 'URL Context 讀取' : '網路搜尋'}</span>
              ${source.publishedDate ? `<time datetime="${escapeHtml(source.publishedDate)}">發布 ${escapeHtml(source.publishedDate.replaceAll('-', '/'))}</time>` : ''}</div>
          </div></li>`;
        })).join('')}</ol>` : ''}
      ${widget ? `<iframe title="Google 搜尋建議" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" srcdoc="${escapeHtml(widget)}"></iframe>` : ''}
    </aside>`;
  }

  function renderCompactReport(report, symbol, peerData, valuationData) {
    const { company, products = [], history, management, industry, thesis, risks } = report;
    const available = value => typeof value === 'string' && value.trim()
      && !/^(未披露|未提供|未公開|不適用|無資料|資料不足|目前資料不足|目前無法|暫無|無法確認|尚未披露)/.test(value.trim());
    const paragraph = value => available(value) ? `<p class="brief-prose">${escapeHtml(value)}</p>` : '';
    const table = (headings, rows) => rows.length ? `<div class="brief-table-wrap"><table class="brief-table">
      <thead><tr>${headings.map(h => `<th scope="col">${escapeHtml(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(row => `<tr>${row.map((cell, i) => `<${i ? 'td' : 'th scope="row"'}>${escapeHtml(available(cell) ? cell : '')}</${i ? 'td' : 'th'}>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
    const expandedBusiness = Array.isArray(company.process);
    const flow = (expandedBusiness ? company.process.map(step => [step.stage, step.description])
      : [ ['付費客戶', company.customers], ['產品與服務', products.filter(p => available(p.name)).map(p => p.name).join('、')],
        ['收入來源', company.revenue] ]).filter(([label, value]) => available(label) && available(value));
    const pricingRows = company.pricing ? [['收費模式', company.pricing.model], ['營收認列', company.pricing.recognition],

      <div style="--flow-count:${flow.length}">${flow.map(([label, value], i) => `<div class="brief-flow-step"><span>0${i + 1}</span><h4>${escapeHtml(label)}</h4><p>${escapeHtml(value)}</p></div>`).join('')}</div></figure>` : '');
    const expandedBusinessBody = business
      + (expandedBusiness && available(company.profitCapture) ? `<div class="brief-business-insight"><h4>利潤與價值捕捉</h4>${paragraph(company.profitCapture)}</div>` : '')
      + (pricingRows.length ? `<div class="brief-business-detail"><h4>收費模式與營收確認</h4>${table(['面向', '運作方式'], pricingRows)}</div>` : '')
      + (expandedBusiness && available(company.defensibility) ? `<div class="brief-business-detail"><h4>商業模式的可複製性</h4>${paragraph(company.defensibility)}</div>` : '');
    const productRows = products.filter(p => available(p.name) && (available(p.significance) || p.examples.some(available)))
      .map(p => [p.name, p.examples.filter(available).join('、'), p.significance]);
    const structuredHistory = Array.isArray(history.milestones);
    const historyRows = structuredHistory
      ? history.milestones.filter(item => available(item.year) && available(item.event))
        .map(item => [item.year, item.event, item.significance])
      : [['發展轉折', history.milestones], ['營運布局', history.footprint]].filter(([, v]) => available(v));
    const footprintRows = structuredHistory ? [['研發中心', history.footprint.research],
      ['製造與組裝', history.footprint.manufacturing], ['銷售通路與覆蓋', history.footprint.sales]]
      .filter(([, value]) => available(value)) : [];
    const historyBody = structuredHistory
      ? (available(history.summary) ? '<h4>戰略進化核心總結</h4>' + paragraph(history.summary) : '')
        + (historyRows.length ? '<h4>重大轉折點</h4>' + table(['年份', '關鍵事件', '商業與戰略意義'], historyRows) : '')
        + (footprintRows.length ? `<h4>全球營運與製造足跡</h4><ul>${footprintRows.map(([label, value]) =>
          `<li><strong>${escapeHtml(label)}：</strong>${escapeHtml(value)}</li>`).join('')}</ul>` : '')
      : table(['面向', '關鍵事實'], historyRows);
    const structuredManagement = Array.isArray(management.pillars);

      ? management.pillars.filter(item => available(item.pillar) && (available(item.objective) || available(item.initiatives)))
        .map(item => [item.pillar, item.objective, item.initiatives])
      : [['經營團隊', management.team], ['策略方向', management.strategy]].filter(([, v]) => available(v));
    const capitalPoints = structuredManagement ? management.capitalAllocation.filter(available) : [];
    const managementBody = structuredManagement
      ? (available(management.leadership) ? '<h4>領導層核心動態</h4>' + paragraph(management.leadership) : '')
        + (managementRows.length ? '<h4>策略支柱</h4>' + table(['核心支柱', '戰略目標', '具體推動項目或關鍵觀察指標'], managementRows) : '')
        + (capitalPoints.length ? `<h4>資本配置哲學</h4><ul>${capitalPoints.map(value => `<li>${escapeHtml(value)}</li>`).join('')}</ul>` : '')
      : table(['策略面向', '重點'], managementRows);
    const comparison = [['產業與競爭者', industry.competition], ['差異與限制', industry.advantage]].filter(([, v]) => available(v));
    const peerComparison = Object.hasOwn(industry, 'peerInsight');

    const structuredThesis = Array.isArray(thesis.matrix);
    const thesisRows = structuredThesis
      ? thesis.matrix.filter(item => available(item.dimension) && (available(item.bull) || available(item.bear)))
        .map(item => [item.dimension, item.bull, item.bear])
      : [['研究論點', thesis.opportunity], ['驗證條件與反證', thesis.condition]].filter(([, v]) => available(v));
    const thesisReading = available(thesis.reading) ? thesis.reading.split(/\r?\n/)
      .map(line => line.trim().replace(/^(?:[-*]\s+|[•●]\s*|\d+[.)、]\s+)/u, ''))
      .filter(Boolean).join(' ').replace(/\s+/g, ' ').trim() : '';
    const thesisBody = structuredThesis
      ? window.renderValuationSnapshot(valuationData)
        + table(['關鍵分析維度', '正向支持條件（Bull Case）', '核心反證／破口條件（Bear Risks）'], thesisRows)
        + (thesisReading ? `<div class="revenue-reading thesis-reading"><p>${escapeHtml(thesisReading)}</p></div>` : '')
      : thesisRows.length ? `<div class="brief-argument">${thesisRows.map(([label,v]) => `<div><span>${label}</span><p>${escapeHtml(v)}</p></div>`).join('')}</div>` : '';
    const structuredRisks = !Array.isArray(risks);
    const riskRows = structuredRisks
      ? risks.matrix.filter(r => available(r.dimension) && available(r.watch))
        .map(r => [r.dimension, ['高', '中'].includes(r.impact) ? r.impact : '',
          ['高', '中'].includes(r.probability) ? r.probability : '', r.watch])
      : risks.filter(r => available(r.risk) && available(r.reason)).map(r => [r.risk, r.reason, r.watch]);
    const cascade = structuredRisks ? risks.cascade.filter(available) : [];
    const catalysts = structuredRisks ? risks.catalysts.filter(item => available(item.event) && available(item.watch))
      .map(item => [available(item.timing) ? `${['已公告', '預計'].includes(item.status) ? `${item.status}：` : ''}${item.timing}` : '',
        item.event, item.watch]) : [];
    const risksBody = structuredRisks
      ? (riskRows.length ? '<h4>核心風險評估矩陣</h4>' + table(['風險維度', '潛在衝擊', '發生機率（定性）', '核心觀察重點'], riskRows) : '')
        + (cascade.length ? `<figure class="bear-cascade${cascade.length > 3 ? ' bear-cascade--stacked' : ''}">
          <figcaption><span>BEAR CASE CASCADE</span><h4>熊市骨牌推導</h4></figcaption>
          <ol class="bear-cascade-steps" role="list" style="--cascade-count:${cascade.length}">${cascade.map((step, i) =>
            `<li class="bear-cascade-step"><span class="bear-cascade-number" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span><p>${escapeHtml(step)}</p></li>`).join('')}</ol>
          </figure>` : '')
        + (catalysts.length ? '<h4>未來關鍵催化劑</h4>' + table(['時間', '事件', '該看什麼數據'], catalysts) : '')
      : table(['風險', '可能影響', '觀察訊號'], riskRows);
    const sections = [
      ['business', 'Business', '公司如何運作', expandedBusinessBody, company],
      ['segments', 'Segments', '業務與地區營收占比', table(['業務分部', '代表產品／服務', '對公司的意義'], productRows) + renderRevenuePlaceholder(), products, !productRows.length],
      ['history', 'History & Footprint', '發展歷程與布局', historyBody, history],
      ['management', 'Management & Strategy', '團隊與策略方向', managementBody, management],
      ['industry', peerComparison ? 'Peer Financials & Valuation' : 'Industry & Competition', peerComparison ? '同業財務與估值對照' : '產業與競爭位置', industryBody, industry],
      ['thesis', structuredThesis ? 'Investment Thesis' : 'Thesis', structuredThesis ? '核心研究論點' : '值得關注的理由', thesisBody, thesis],
      ['risks', 'Risks & Catalysts', '主要風險與催化劑', risksBody, risks]
    ].filter(([, , , body]) => body);
    return `<div class="brief-layout"><nav class="brief-toc" aria-label="報告章節"><span>CONTENTS</span>
      ${sections.map(([id, english, title, , , hidden], i) => `<a href="#brief-${id}" data-report-link="${id}"${hidden ? ' hidden' : ''}><b>${String(i + 1).padStart(2, '0')}</b>${escapeHtml(title)}</a>`).join('')}</nav>
      <section class="quick-overview compact-report brief-report"><header class="brief-cover">
        <span class="quick-overview__eyebrow">COMPANY RESEARCH / 公司研究</span>
        <h2>${escapeHtml(company.symbol || symbol)}</h2><p>看懂生意，理解機會與風險。</p></header>
      ${sections.map(([id, english, title, body, context, hidden], i) => `<article id="brief-${id}" class="quick-topic brief-chapter"${id === 'segments' ? ' data-segment-chapter' : ''}${hidden ? ' hidden' : ''}>
        <header><span>${String(i + 1).padStart(2, '0')} / ${escapeHtml(english)}</span><h3>${escapeHtml(title)}</h3></header>
        ${body}</article>`).join('')}
      </section></div>`;
  }

  function renderCompanyReport(sections, symbol, chartHtml) {
    return renderCompactReport(sections.compactReport, symbol, sections.peerData, sections.valuationData)
      + renderReadingChapter('股價走勢', symbol, chartHtml);
  }

  function readCompanySections(data) {
    if (!data?.report?.company || !data.report.history) {
      throw new Error('報告版本不相容，請更新後端後重新產生。');
    }
    return { compactReport: validateCompactReport(data.report, data.reportFormat),
      peerData: data.peerData, valuationData: data.valuationData };
  }

  document.getElementById("symbolInput").addEventListener("keydown", event => {
    if (event.key !== "Enter" || event.isComposing) return;
    event.preventDefault();

    const fetchBtn = document.getElementById("fetchBtn");
    if (!fetchBtn.disabled) fetchBtn.click();
  });

  document.getElementById("fetchBtn").addEventListener("click", async () => {
    const debugEl = document.getElementById("debug");
    const resultEl = document.getElementById("result");
    const symbolInput = document.getElementById("symbolInput");
    const fetchBtn = document.getElementById("fetchBtn");
    
    const symbol = symbolInput.value.trim().toUpperCase();
    if (!symbol) {
      alert("請輸入股票代碼！");
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();

    
    fetchBtn.disabled = true;
    fetchBtn.textContent = "正在分析數據...";
    debugEl.textContent = "查詢中…正在分析數據...";
    resultEl.innerHTML = "<p>正在整理業務、分部、歷程、團隊策略、產業競爭、研究論點與風險七個短章節。首次生成可能需要 1–3 分鐘。</p>";
    let stopAdoptionCard = () => {};
    if (!session?.user || session.user.is_anonymous) {
      const adoptionContainer = document.createElement('div');
      resultEl.appendChild(adoptionContainer);
      stopAdoptionCard = startAdoptionCard(adoptionContainer);
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 210000);
    try {
      const response = await fetch(BACKEND_URL, {
        signal: controller.signal,
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(session ? { "Authorization": `Bearer ${session.access_token}` } : {})
        },
        body: JSON.stringify({ symbol: symbol })
      });

      const rawResponse = await response.text();
      let data;
      try {
        data = JSON.parse(rawResponse);
      } catch (error) {
        throw new Error(`報告服務暫時無法回應（HTTP ${response.status}），請稍後再試。`);
      }

      if (!response.ok) {
        if (response.status === 403) {
          showPlanModal(data.error || "已達使用上限。", data.loginRequired);
          debugEl.textContent = "已達使用上限 ⛔";
          resultEl.innerHTML = "";
          return;
        }
        throw new Error((data.error || "伺服器發生錯誤") + (data.requestId ? `（查詢編號：${data.requestId}）` : ""));
      }
      
      const resultElement = document.getElementById("result");


   
      const sections = readCompanySections(data);
      const chartHtml = isTaiwanStock(symbol)
        ? `
        <div style="margin-bottom:25px; padding:18px 20px; border-radius:12px; background:rgba(15,23,42,0.72); border:1px solid rgba(148,163,184,0.25); color:#cbd5e1;">
          台股圖表暫不嵌入 TradingView，本頁先聚焦公司與產業分析。
        </div>`
        : `
        <div style="height:450px; margin-bottom:25px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
          <iframe
            src="https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(symbol)}&interval=D&theme=dark&style=1&timezone=Asia%2FTaipei"
            width="100%" height="100%" frameborder="0" allowfullscreen>
          </iframe>
        </div>`;
      
      const sourceDocumentCount = collectReportSources(data).documentCount;
      const sourceNotice = data.sourceInfo ? `<aside class="report-data-status" role="status">
        ${data.cached ? "已載入近 3 天內的公司報告" : "公司報告已生成"}${sourceDocumentCount > 0 ? `｜${data.sourceInfo.provider === 'google_search_url_context' ? 'Google 搜尋參考來源' : '搜尋資料'} ${sourceDocumentCount} 份文件` : ''}
        ${data.generatedAt ? `｜生成時間：${escapeHtml(new Date(data.generatedAt).toLocaleString('zh-TW'))}` : ""}
      </aside>` : "";
      resultElement.innerHTML = sourceNotice + renderCompanyReport(sections, symbol, chartHtml) + renderReportSources(data);
      const revenueContainer = document.getElementById('revenueCharts');
      if (typeof window.loadRevenueCharts === 'function') {
        window.loadRevenueCharts(revenueContainer, BACKEND_URL, symbol, data.revenueData, sections.compactReport?.segmentInsights);
      } else {
        revenueContainer.closest('.revenue-section').hidden = true;
      }

     
      debugEl.textContent = "查詢完成 ✔";

      const { user, plan } = await getCurrentUserPlan();
      await updateUsageInfo(user, plan);

    } catch (err) {
      console.error(err);
      debugEl.textContent = "錯誤：" + err.message;
      const errorMessage = err.name === "AbortError"
        ? "報告等待時間過長，請稍後再試。"
        : /Request failed with status code 503/i.test(err.message)
        ? "上游資料服務暫時無法使用，請稍後重新產生報告。"
        : err.message || "報告生成失敗，請稍後再試。";
      debugEl.textContent = "錯誤：" + errorMessage;
      resultEl.innerHTML = `<p role="alert" style="color:#ffd0d6">${escapeHtml(errorMessage)}</p>`;
    } finally {
      clearTimeout(timeout);
      stopAdoptionCard();
    
      fetchBtn.disabled = false;
      fetchBtn.textContent = "產生公司介紹";
    }
  });

</script>
</body>
</html>
