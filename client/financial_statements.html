<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>財報分析｜懂才抱</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      color: #1c3048;
    }
    .workspace-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 max(28px, calc((100vw - 1380px) / 2)); min-height: 76px; background: #0c1526; color: #eef0fa; }
    .workspace-brand { display: flex; align-items: center; gap: 18px; color: #eef0fa; text-decoration: none; font-size: 23px; font-weight: 700; letter-spacing: 2px; }
    .workspace-brand span { padding-left: 18px; border-left: 1px solid #3c4558; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #a7b2c7; }
    .workspace-header nav { display: flex; align-items: stretch; gap: 28px; align-self: stretch; }
    .workspace-header nav a { display: flex; align-items: center; color: #9faec4; font-size: 13px; text-decoration: none; border-bottom: 2px solid transparent; padding-top: 2px; }
    .workspace-header nav a[aria-current] { color: #eeeafa; border-bottom-color: #b4a4ec; }
    .workspace-header nav a:hover { color: #fff; }
    :is(a, button, input):focus-visible { outline: 3px solid #a296ce; outline-offset: 4px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 30px 48px;
      min-height: calc(100vh - 76px);
      align-items: start;
    }
    .sidebar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 440px);
      column-gap: 32px;
      row-gap: 20px;
      background: #fff;
      color: #1c3048;
      padding: 24px;
      border: 1px solid #e1e6ee;
      border-radius: 12px;
      min-width: 0;
    }
    .tracking-overview, .tracking-form { min-width: 0; }
    .tracking-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .tracking-entry #symbolInput { min-width: 0; }
    .tracking-entry #addBtn { margin: 0; width: auto; padding: 12px 22px; }
    .sidebar-eyebrow { margin: 0 0 12px; color: #8273ac; font-size: 9px; letter-spacing: 2px; }
    .sidebar h1 {
      font-size: 23px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .sidebar-description { margin: 0 0 16px; color: #7a8799; font-size: 12px; line-height: 1.8; }
    .sidebar .plan {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      padding: 12px;
      margin-bottom: 0;
      max-width: 320px;
      border-radius: 7px;
      background: #f3f5f9;
      color: #6a7b90;
    }
    .plan strong { color: #3f536c; font-weight: 500; }
    .sidebar label {
      font-size: 12px;
      color: #596b82;
      display: block;
      margin: 0 0 10px;
    }
    .sidebar input {
      width: 100%;
      padding: 13px 12px;
      border-radius: 7px;
      border: 1px solid #dce2ec;
      background: #fff;
      color: #1c3048;
      font: inherit;
      font-size: 16px;
      box-sizing: border-box;
    }
    .sidebar button {
      margin-top: 10px;
      padding: 13px 12px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      background: #243a55;
      color: #f9fafb;
      font-size: 14px;
      width: 100%;
    }
    .sidebar button:disabled {
      background: #9ba7b7;
      cursor: not-allowed;
    }
    .stock-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      grid-column: 1 / -1;
      min-width: 0;
      margin-top: 0;
      font-size: 14px;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px;
      flex: 1 1 170px;
      min-width: 0;
      border-radius: 8px;
      margin-bottom: 0;
      border: 1px solid #e3e8f0;
    }
    .stock-item:hover {
      background: #f5f7fa;
    }
    .stock-item.active {
      background: #f0edf7;
      border-color: #d8cfea;
    }
    .stock-item .status-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #e9edf3;
      color: #718098;
    }
    .stock-item .stock-remove {
      margin: 0;
      padding: 9px 7px;
      font-size: 11px;
      color: #8b6c79;
      background: transparent;
      width: auto;
    }
    .stock-item .stock-select { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px 9px; flex: 1; min-width: 0; width: auto; background: transparent; color: #3a506d; text-align: left; padding: 10px 8px; margin: 0; }
    .stock-symbol { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .stock-item.active .stock-symbol { color: #66518c; }
    .watchlist-heading { display: flex; grid-column: 1 / -1; align-items: center; justify-content: space-between; border-top: 1px solid #e7ebf1; padding-top: 18px; margin-top: 0; }
    .watchlist-heading h2 { font-size: 12px; font-weight: 500; margin: 0; color: #596b82; }
    #trackedCount { color: #8b96a6; font-size: 11px; }
    #trialHint { font-size: 11px; margin-top: 12px; color: #7b8798; line-height: 1.8; }
    #financialAuthEntry { margin: 12px 0 0; font-size: 12px; }
    #financialAuthEntry a { color: #786499; text-underline-offset: 3px; }
    .stock-list-empty { color: #97a1b0; padding: 12px 0; font-size: 12px; }

    .content {
      min-width: 0;
    }
    .dashboards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      min-width: 0;
      margin: 0 auto;
    }
    .dash-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e1e6ee;
      padding: 24px;
      box-shadow: none;
      min-height: 500px;
    }
    .dash-card h2 {
      font-size: 20px;
      margin: 0 0 16px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
    }
    .dashboard-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid #e7ebf1; }
    .dashboard-heading .dashboard-eyebrow { margin: 0 0 10px; color: #8a96a7; font-size: 9px; letter-spacing: 1.7px; }
    .dashboard-heading h2 { font-size: 22px; color: #243c57; border: 0; padding: 0; margin: 0; }
    .dashboard-heading .status-badge { margin: 0; }
    .dash-card > details { color: #6a7b90; font-size: 12px; line-height: 1.9; }
    .dash-card > details summary { cursor: pointer; }
    .dash-card > details a { color: #3f5978; overflow-wrap: anywhere; }
    .dash-card :is(#retryFinancialBtn, #startFinancialBtn, #resumeFinancialBtn) { background: #243a55; border: 0; border-radius: 7px; padding: 12px 20px; color: #fff; cursor: pointer; font: inherit; font-size: 13px; }
    .dash-card button:disabled { cursor: not-allowed; opacity: .55; }
    .financial-empty { display: grid; align-content: center; min-height: 660px; padding: 64px clamp(24px, 5vw, 70px); }
    .financial-empty .empty-eyebrow { color: #8273ac; font-size: 10px; letter-spacing: 2.5px; margin: 0 0 20px; }
    .financial-empty h2 { border: 0; color: #243c57; padding: 0; margin: 0 0 20px; font-size: clamp(26px, 2.6vw, 36px); font-weight: 600; line-height: 1.5; letter-spacing: -.03em; }
    .financial-empty .empty-description { max-width: 480px; color: #7a8799; font-size: 14px; line-height: 1.9; margin: 0 0 32px; }
    .empty-features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 30px; }
    .empty-feature { min-width: 0; border: 1px solid #e3e8f0; background: #f7f9fc; border-radius: 8px; padding: 20px 14px; }
    .empty-feature strong { display: block; color: #50647e; font-size: 12px; font-weight: 500; margin-top: 18px; }
    .empty-feature svg { width: 100%; max-width: 100px; height: 52px; display: block; }
    .empty-hint { color: #8a96a7; font-size: 12px; line-height: 1.9; margin: 0; }
    .state-card { display: grid; place-content: center; text-align: center; padding: 48px 30px; min-height: 500px; }
    .state-card h2 { border: 0; padding: 0; margin: 0 0 16px; color: #29425e; font-size: 22px; }
    .state-card p { color: #7a8799; font-size: 14px; line-height: 1.9; max-width: 520px; margin: 0 auto 24px; }
    .financial-loading-mark { display: block; height: 30px; width: 30px; border-radius: 50%; border: 2px solid #e6eaf1; border-top-color: #9c89bd; margin: 0 auto 26px; animation: financial-spin 1s linear infinite; }
    @keyframes financial-spin { to { transform: rotate(360deg); } }
    
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 10px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      background: white;
      color: #374151;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: #f9fafb;
    }
    .tab-btn.active {
      background: #243a55;
      color: white;
      border-color: #243a55;
    }

    .view-section {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }
    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 8px;
      background: #f9fafb;
    }

    .report-deck {
      position: relative;
      overflow: hidden;
      border: 1px solid #dfe6ef;
      border-radius: 12px;
      background: #ffffff;
      color: #34465b;
      box-shadow: none;
    }
    .report-slide {
      display: none;
      animation: slideReveal 0.35s ease;
    }
    .report-slide.active {
      display: block;
    }
    .report-slide-copy {
      position: relative;
      overflow: hidden;
      padding: 32px 36px;
      border-top: 3px solid var(--chapter-color, #8b79ae);
      background: radial-gradient(ellipse at 100% 0, var(--chapter-tint, #f0ecf7), transparent 60%), #fff;
    }
    .report-chapter-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .report-chapter-number { flex-shrink: 0; font-size: clamp(48px, 6vw, 76px); line-height: 1; font-weight: 700; letter-spacing: -.06em; color: var(--chapter-color, #8b79ae); opacity: .23; font-variant-numeric: tabular-nums; user-select: none; }
    .report-chapter-label { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 16px; color: var(--chapter-color, #8b79ae); font-size: 12px; font-weight: 600; }
    .report-chapter-label::before { content: ''; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    .report-slide-body > p:first-child { padding-left: 18px; border-left: 2px solid var(--chapter-color, #8b79ae); }
    .report-slide-body > :last-child { margin-bottom: 0; }
    .report-progress { height: 3px; background: #eef0f5; }
    .report-progress span { display: block; width: var(--reading-progress); height: 100%; background: linear-gradient(90deg, #b4a3d2, #7b94aa); transition: width .25s ease; }
    .report-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: #7a879c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .report-kicker::before {
      content: "";
      width: 28px;
      height: 2px;
      background: #a99ac7;
    }
    .report-slide h3 {
      margin: 0 0 20px;
      color: #243e5b;
      font-size: clamp(21px, 2.2vw, 27px);
      line-height: 1.5;
      letter-spacing: -.02em;
    }
    .report-slide-body {
      max-width: 78ch;
      color: #526277;
      font-size: 16px;
      line-height: 1.95;
      overflow-wrap: anywhere;
    }
    .report-slide-body p {
      margin: 0 0 16px;
    }
    .report-slide-body ul,
    .report-slide-body ol {
      margin: 0;
      padding-left: 22px;
    }
    .report-slide-body li {
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .report-slide-body li::marker {
      color: #9684b8;
    }
    .report-slide-body strong {
      color: #29435e;
    }
    .report-deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 36px;
      border-top: 1px solid #e8ecf3;
      background: #fafbfd;
    }
    .report-deck-nav,
    .report-deck-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .report-deck-dots {
      flex-wrap: wrap;
      flex: 1 1 340px;
    }
    .report-deck button {
      border: 1px solid #dfe5ee;
      background: #ffffff;
      color: #526277;
      cursor: pointer;
    }
    .report-deck button:hover:not(:disabled) {
      background: #f0ecf7;
      border-color: #c8bcdf;
    }
    .report-deck button:focus-visible {
      outline: 2px solid #8c79ae;
      outline-offset: 3px;
    }
    .report-nav-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      font-size: 18px;
    }
    .report-nav-btn:disabled {
      opacity: .35;
      cursor: default;
    }
    .report-dot {
      flex: 1 1 auto;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
    }
    .report-dot.active {
      color: var(--chapter-color, #6e548f);
      background: var(--chapter-tint, #eee9f6);
      border-color: var(--chapter-color, #d8cde8);
    }
    .report-dot-number { font-size: 10px; opacity: .65; margin-right: 7px; font-variant-numeric: tabular-nums; }
    .report-page {
      color: #7a879c;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .report-empty {
      padding: 60px 30px;
      border-radius: 16px;
      background: #f8fafc;
      color: #64748b;
      text-align: center;
    }
    .official-document { padding: 22px; border: 1px solid #dfe6ef; border-radius: 10px; background: linear-gradient(115deg, #f3f6fa, #faf9fd); margin-bottom: 24px; }
    .official-document-title { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .official-document-icon { width: 44px; height: 44px; padding: 10px; box-sizing: border-box; border: 1px solid #ddd6eb; border-radius: 10px; background: #eee9f6; color: #8b79ae; flex-shrink: 0; }
    .official-document-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .official-document h3 { margin: 0 0 8px; font-size: 17px; color: #29435e; }
    .official-document p { color: #7b899c; font-size: 12px; line-height: 1.8; margin: 0; }
    .official-document-link { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border: 1px solid #d5ddea; border-radius: 7px; color: #354f6c; background: #fff; text-decoration: none; font-size: 13px; }
    .official-document-link:hover { background: #eef2f8; }
    .official-document details { margin-top: 18px; border-top: 1px solid #e0e6ef; padding-top: 16px; }
    .official-document summary { color: #556b86; cursor: pointer; font-size: 13px; }
    .official-document .original-excerpt { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; margin: 18px 0 12px; padding: 20px; background: #fff; border: 1px solid #e2e7ef; border-radius: 7px; font-size: 14px; line-height: 1.9; color: #46586c; }
    .translation-heading { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; }
    .translation-heading h3 { color: #29435e; font-size: 17px; margin: 0; }
    .translation-heading p { color: #8490a2; font-size: 12px; margin: 0; line-height: 1.8; }

    @keyframes slideReveal {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f0edf7;
      color: #786499;
      margin-bottom: 10px;
    }
    .status-badge.pending {
      background: #fff7ed;
      color: #c2410c;
    }

@media (max-width: 768px) {
  .workspace-header { min-height: 66px; padding: 0 20px; gap: 18px; }
  .workspace-brand { font-size: 20px; letter-spacing: 1px; }
  .workspace-brand span { display: none; }
  .workspace-header nav { gap: 20px; }
  .workspace-header nav a { font-size: 12px; }
  .layout {
    grid-template-columns: minmax(0, 1fr);
    padding: 20px 16px 32px;
    gap: 20px;
    min-height: calc(100vh - 66px);
  }
  .sidebar {
    grid-template-columns: minmax(0, 1fr);
    row-gap: 16px;
    padding: 22px;
  }
  .sidebar-eyebrow, .sidebar-description { display: none; }
  .sidebar h1 { font-size: 21px; margin-bottom: 18px; }
  .sidebar .plan { margin-bottom: 0; max-width: none; }
  .tracking-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .tracking-entry #symbolInput { min-width: 0; }
  .tracking-entry #symbolInput::placeholder { font-size: 12px; }
  .tracking-entry #addBtn { margin: 0; width: auto; padding: 12px; font-size: 12px; }
  .watchlist-heading { margin-top: 0; padding-top: 18px; }
  .stock-list {
    flex-wrap: nowrap;
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .stock-item {
    flex: 0 0 auto;
    margin-bottom: 0;
    min-width: 150px;
    max-width: 240px;
    padding: 4px;
    border-color: #e3e8f0;
  }
  .stock-item .stock-select { flex-direction: column; }
  .content {
    padding: 0;
  }
  .dash-card {
    padding: 16px;
    min-height: auto;
  }
  .financial-empty { min-height: 0; padding: 34px 24px; }
  .financial-empty h2 { font-size: 27px; }
  .empty-features { gap: 8px; }
  .empty-feature { padding: 16px 10px; }
  .empty-feature strong { font-size: 11px; line-height: 1.6; }
  .state-card { min-height: 340px; padding: 38px 24px; }
  .state-card h2 { font-size: 20px; }
  .dashboard-heading h2 { font-size: 20px; line-height: 1.6; }
  .tab-container {
    flex-direction: column;
  }
  .tab-btn {
    width: 100%;
    text-align: center;
    padding: 12px;
    font-size: 16px;
  }
  iframe {
    height: 500px;
  }
  .report-slide-copy {
    padding: 24px 20px;
  }
  .report-slide h3 {
    font-size: 21px;
  }
  .report-slide-body {
    font-size: 15px;
  }
  .report-deck-controls {
    padding: 16px 20px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
  </style>
</head>
<body>
<header class="workspace-header">
  <a class="workspace-brand" href="index.html" aria-label="懂才抱首頁">懂才抱<span>RESEARCH</span></a>
  <nav aria-label="主要功能">
    <a href="stock_integration.html">公司研究</a>
    <a href="financial_statements.html" aria-current="page">財報分析</a>
  </nav>
</header>
<div class="layout">
  <aside class="sidebar" aria-label="財報追蹤管理">
    <div class="tracking-overview">
      <p class="sidebar-eyebrow">FINANCIAL WORKSPACE</p>
      <h1>財報分析</h1>
      <p class="sidebar-description">保存你的追蹤清單，掌握公司的財務變化。</p>
      <div class="plan">
        <span id="planName">載入中...</span>
        <span>追蹤上限 <strong><span id="planLimit">-</span> 檔</strong></span>
      </div>
    </div>
    <div class="tracking-form">
      <label for="symbolInput">新增追蹤股票</label>
      <div class="tracking-entry">
        <input id="symbolInput" placeholder="例如 AAPL、2330" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-describedby="trialHint" />
        <button id="addBtn" type="button">新增追蹤</button>
      </div>
      <div id="trialHint">訪客可瀏覽 AAPL 固定示範，登入後可追蹤 5 檔。</div>
      <p id="financialAuthEntry" hidden><a href="index.html?login=1" target="_blank" rel="noopener">登入／免費註冊</a></p>
    </div>

    <div class="watchlist-heading"><h2>你的追蹤清單</h2><span id="trackedCount">0 檔</span></div>
    <div class="stock-list" id="stockList"></div>
  </aside>

  <main class="content">
    <div class="dashboards" id="dashboards"></div>
  </main>
</div>

<script>
  const supabaseUrl = "https://zlkexplsleznuebighte.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68";
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const FINANCIAL_TRACKING_LIMIT = 5;
  const FINANCIAL_BACKEND = 'https://dongcaibao.onrender.com';
  let pollTimer = null;
  let loadingStocks = false;
  let addingStock = false;
  let initVersion = 0;
  const startingReports = new Set();

  function escapeFinancial(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  async function startFinancialReport(id) {
    if (startingReports.has(id)) return;
    startingReports.add(id);
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session || session.user.is_anonymous) throw new Error('請先登入會員，訪客可瀏覽固定示範報告。');
      const response = await fetch(`${FINANCIAL_BACKEND}/api/financial-reports`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ trackingId: id }), signal: AbortSignal.timeout(20000)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '財報生成暫時無法啟動。');
    } finally { startingReports.delete(id); }
  }

  function scheduleFinancialPoll() {
    clearTimeout(pollTimer);
    if (!isGuest && currentUser && tracked.some(s => ['pending', 'financial_queued', 'financial_running'].includes(s.status))) {
      pollTimer = setTimeout(loadTrackedStocks, 5000);
    }
  }

  function renderFinancialSources(report) {
    if (report?.generation_provider !== 'google_search_url_context') return '';
    const sources = (Array.isArray(report.sources) ? report.sources : []).flatMap(source => {
      try {
        const url = new URL(source.url);
        if (url.protocol !== 'https:' || url.username || url.password) return [];
        return [`<li><a href="${escapeFinancial(url.href)}" target="_blank" rel="noopener noreferrer">${escapeFinancial(source.title || url.hostname)}</a></li>`];
      } catch { return []; }
    });
    const suggestions = typeof report.searchEntryPointHtml === 'string' && report.searchEntryPointHtml
      ? `<iframe title="Google 搜尋建議" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" style="width:100%;height:150px;border:0" srcdoc="${escapeFinancial(report.searchEntryPointHtml)}"></iframe>` : '';
    return sources.length || suggestions ? `<details style="margin-top:20px"><summary>研究來源</summary><ul>${sources.join('')}</ul>${suggestions}</details>` : '';
  }

  function renderOfficialDocument(report) {
    const filing = report?.filing;
    let url;
    try {
      url = new URL(filing?.url);
      if (url.protocol !== 'https:' || !['www.sec.gov', 'sec.gov'].includes(url.hostname)
          || url.username || url.password || url.port || !url.pathname.startsWith('/Archives/')) return '';
    } catch { return ''; }
    const document = report.officialDocument;
    const text = document?.url === filing.url && typeof document.text === 'string' ? document.text.slice(0, 65000) : '';
    // Older cached extracts may contain hidden XBRL data that lost its HTML boundaries.
    const hasXbrlNoise = /(?:fasb\.org\/us-gaap|xbrl\.sec\.gov\/country|\b(?:us-gaap|xbrli|iso4217):)/i.test(text);
    const excerpt = hasXbrlNoise ? '' : text;
    const filingDate = String(filing.filingDate || '').replace(/^(\d{4}-\d{2}-\d{2})(?:[ T].*)?$/, '$1');
    const metadata = [filing.form, filingDate ? `申報日期：${filingDate}` : '', 'SEC 官方申報文件'].filter(Boolean);
    return `<section class="official-document" aria-label="官方原文">
      <div class="official-document-heading"><div class="official-document-title"><svg class="official-document-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v5h4M9 12h6M9 16h6"/></svg><div><h3>官方財報原文</h3><p>${metadata.map(escapeFinancial).join(' · ')}</p></div></div>
        <a class="official-document-link" href="${escapeFinancial(url.href)}" target="_blank" rel="noopener noreferrer">閱讀官方完整原文 ↗</a></div>
      ${excerpt ? `<details><summary>展開官方原文文字摘錄</summary><div class="original-excerpt" lang="en" tabindex="0" role="region" aria-label="官方原文文字摘錄">${escapeFinancial(excerpt)}</div>
        <p>此處為文件開頭的文字摘錄；完整排版、表格與後續章節請開啟官方原文。</p></details>` : ''}
    </section>`;
  }

  let currentUser = null;
  let currentLimit = FINANCIAL_TRACKING_LIMIT;
  let isGuest = true;
  let tracked = [];
  let selectedStockId = null;

  async function init() {
    const version = ++initVersion;
    clearTimeout(pollTimer);
    document.getElementById("addBtn").disabled = true;
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) throw error;
      if (version !== initVersion) return;
      const previousUserId = currentUser?.id;
      const wasGuest = isGuest;
      currentUser = data.session?.user || null;
      isGuest = !currentUser || !!currentUser.is_anonymous;
      document.getElementById('financialAuthEntry').hidden = !isGuest;
      currentLimit = isGuest ? 0 : FINANCIAL_TRACKING_LIMIT;
      document.getElementById('symbolInput').disabled = isGuest;
      document.getElementById("planName").textContent = isGuest ? "訪客示範" : "免費會員";
      document.getElementById("planLimit").textContent = isGuest ? '登入後 5' : currentLimit;
      document.getElementById("trialHint").textContent = isGuest
        ? "瀏覽 AAPL 固定示範，登入後即可分析與追蹤自己的股票。"
        : "每位會員可保存 5 檔股票的財報追蹤清單。";
      if (!isGuest) {
        if (wasGuest || previousUserId !== currentUser.id) {
          tracked = [];
          selectedStockId = null;
          renderStockList();
          document.getElementById('dashboards').textContent = '正在讀取財報…';
        }
        await loadTrackedStocks();
      }
      else {
        tracked = [];
        selectedStockId = null;
        renderStockList();
        document.getElementById('dashboards').textContent = '正在讀取 AAPL 示範報告…';
        const response = await fetch(`${FINANCIAL_BACKEND}/api/demo-reports/financial`, { signal: AbortSignal.timeout(20000) });
        const demo = await response.json();
        if (version !== initVersion) return;
        if (!response.ok) throw new Error(demo.error || '示範報告暫時無法讀取。');
        if (demo.symbol !== 'AAPL' || demo.report_json?.symbol !== 'AAPL') throw new Error('示範報告資料不正確。');
        tracked = [{ id: 0, symbol: 'AAPL', status: 'ready', demo: true, report_json: demo.report_json, summary: demo.summary }];
        selectedStockId = 0;
        renderStockList();
        await renderDashboards();
      }
    } catch (error) {
      if (version !== initVersion) return;
      document.getElementById('financialAuthEntry').hidden = false;
      document.getElementById("dashboards").textContent = error.message || "無法讀取財報，請重新整理後再試。";
      console.error(error);
    } finally {
      if (version === initVersion) updateAddButtonState();
    }
  }

  async function loadTrackedStocks() {
    if (isGuest || !currentUser || loadingStocks) return;
    loadingStocks = true;
    const userId = currentUser.id;
    const before = JSON.stringify(tracked);
    try {
    const { data, error } = await supabaseClient
      .from("tracked_stocks")
      .select("id, symbol, status, report_url, summary, report_json")
      .eq("user_id", userId)
      .order("created_at", { ascending: true });

    if (error) {
      console.error("讀取追蹤股票失敗：", error);
      return;
    }
    if (isGuest || currentUser?.id !== userId) return;

    tracked = data || [];

    if (tracked.length > 0) {
      if (!selectedStockId || !tracked.some(s => s.id === selectedStockId)) {
        selectedStockId = tracked[0].id;
      }
    } else {
      selectedStockId = null;
    }

    if (before !== JSON.stringify(tracked) || !document.querySelector('#dashboards .dash-card')) {
      renderStockList();
      await renderDashboards();
    }
    updateAddButtonState();
    } catch (error) {
      console.error('更新財報狀態失敗：', error);
    } finally {
      loadingStocks = false;
      if (!isGuest && currentUser && currentUser.id !== userId) {
        void loadTrackedStocks();
        return;
      }
      scheduleFinancialPoll();
    }
  }

  function renderStockList() {
    const listEl = document.getElementById("stockList");
    document.getElementById('trackedCount').textContent = `${tracked.length} 檔`;
    if (tracked.length === 0) {
      listEl.innerHTML = '<div class="stock-list-empty">還沒有追蹤股票，從上方新增一檔。</div>';
      return;
    }
    listEl.innerHTML = tracked
      .map(s => {
        const statusMap = {
          ready: "已完成",
          review: "審核中",
          tw_review: "月營收完成",
          tw_ready: "已完成",
          no_report: "無資料",
          financial_queued: "等待處理", financial_running: "生成中", financial_error: "生成未完成"
        };
        let statusText = statusMap[s.status] || "準備中";
        const activeClass = s.id === selectedStockId ? "active" : "";

        return `
          <div class="stock-item ${activeClass}">
            <button class="stock-select" type="button" onclick="selectStock(${s.id})" aria-pressed="${s.id === selectedStockId}">
              <span class="stock-symbol">${escapeFinancial(s.symbol)}</span>
              <span class="status-tag">${statusText}</span>
            </button>
            ${isGuest ? '<span class="status-tag">固定示範</span>' : `<button class="stock-remove" type="button" aria-label="移除 ${escapeFinancial(s.symbol)}" onclick="removeStock(${s.id})">移除</button>`}
          </div>
        `;
      })
      .join("");
  }

  function selectStock(id) {
    selectedStockId = id;
    renderStockList();
    renderDashboards();
  }

  window.switchView = function(viewName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${viewName}`).classList.add('active');

    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(`view-${viewName}`).classList.add('active');
  }

  function isTaiwanStock(symbol) {
    const value = String(symbol || "").trim().toUpperCase();
    return /^\d{4}(\.TW|\.TWO)?$/.test(value);
  }


  function buildReportDeck(markdown, symbol) {
    if (!markdown) {
      return `<div class="report-empty">暫無文字摘要。</div>`;
    }

    const template = document.createElement('template');
    template.innerHTML = marked.parse(markdown);
    const safeTags = new Set(['H1', 'H2', 'H3', 'H4', 'P', 'UL', 'OL', 'LI', 'STRONG', 'EM', 'B', 'I', 'CODE', 'PRE', 'BR', 'HR', 'BLOCKQUOTE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD']);
    for (const node of Array.from(template.content.querySelectorAll('*'))) {
      if (!safeTags.has(node.tagName)) node.replaceWith(document.createTextNode(node.textContent));
      else for (const attr of Array.from(node.attributes)) node.removeAttribute(attr.name);
    }
    const parsed = document.createElement('div');
    parsed.append(template.content);
    const slides = [];
    let currentSlide = null;

    Array.from(parsed.children).forEach(node => {
      if (/^H[1-3]$/.test(node.tagName)) {
        currentSlide = {
          title: node.textContent.trim(),
          content: []
        };
        slides.push(currentSlide);
      } else {
        if (!currentSlide) {
          currentSlide = {
            title: `${symbol} 官方文件摘要`,
            content: []
          };
          slides.push(currentSlide);
        }
        currentSlide.content.push(node.outerHTML);
      }
    });

    if (slides.length === 0) {
      slides.push({
        title: `${symbol} 官方文件摘要`,
        content: [parsed.innerHTML]
      });
    }

    const chapterThemes = [
      { match: /風險|不確定/, label: '風險觀察', color: '#a17a55', tint: '#fbf3e9' },
      { match: /未來|展望|規劃|指引/, label: '未來展望', color: '#688a9f', tint: '#edf5f9' },
      { match: /變動|變化|轉折/, label: '營運變動', color: '#8c789f', tint: '#f3edf8' },
      { match: /業務|產品/, label: '業務進展', color: '#548e83', tint: '#edf7f3' },
      { match: /總覽|摘要|回顧/, label: '營運總覽', color: '#7b79aa', tint: '#f0eff9' }
    ];
    const chapters = slides.map(slide => chapterThemes.find(theme => theme.match.test(slide.title))
      || { label: slide.title.replace(/^\d+[.、]\s*/, '').slice(0, 12), color: '#7b79aa', tint: '#f0eff9' });
    const slideHtml = slides.map((slide, index) => `
      <section class="report-slide ${index === 0 ? "active" : ""}" data-slide-index="${index}" style="--chapter-color:${chapters[index].color};--chapter-tint:${chapters[index].tint}">
        <div class="report-slide-copy">
          <div class="report-chapter-heading"><div>
          <div class="report-kicker">${escapeFinancial(symbol)} · 官方文件摘要</div>
          <h3>${escapeFinancial(slide.title)}</h3>
          <div class="report-chapter-label">${escapeFinancial(chapters[index].label)}</div>
          </div><span class="report-chapter-number" aria-hidden="true">${String(index + 1).padStart(2, '0')}</span></div>
          <div class="report-slide-body">
            ${slide.content.join("") || "<p>本頁為報告章節封面，請繼續瀏覽下一頁。</p>"}
          </div>
        </div>
      </section>
    `).join("");

    const dotsHtml = slides.map((slide, index) => `
      <button class="report-dot ${index === 0 ? "active" : ""}"
        style="--chapter-color:${chapters[index].color};--chapter-tint:${chapters[index].tint}"
        type="button"
        aria-label="第 ${index + 1} 章：${escapeFinancial(slide.title)}"
        aria-current="${index === 0 ? 'step' : 'false'}"
        onclick="showReportSlide(${index})"><span class="report-dot-number">${String(index + 1).padStart(2, '0')}</span>${escapeFinancial(chapters[index].label)}</button>
    `).join("");

    return `
      <div class="report-deck" id="reportDeck" data-current-slide="0">
        ${slideHtml}
        <div class="report-progress" aria-hidden="true"><span id="reportProgress" style="--reading-progress:${100 / slides.length}%"></span></div>
        <div class="report-deck-controls">
          <div class="report-deck-nav">
            <button class="report-nav-btn" id="reportPrev" type="button" aria-label="上一頁" onclick="moveReportSlide(-1)" disabled>‹</button>
            <button class="report-nav-btn" id="reportNext" type="button" aria-label="下一頁" onclick="moveReportSlide(1)" ${slides.length === 1 ? 'disabled' : ''}>›</button>
            <span class="report-page" id="reportPage">01 / ${String(slides.length).padStart(2, "0")}</span>
          </div>
          <div class="report-deck-dots">${dotsHtml}</div>
        </div>
      </div>
    `;
  }

  window.showReportSlide = function(index) {
    const deck = document.getElementById("reportDeck");
    if (!deck) return;

    const slides = Array.from(deck.querySelectorAll(".report-slide"));
    const dots = Array.from(deck.querySelectorAll(".report-dot"));
    const nextIndex = Math.max(0, Math.min(index, slides.length - 1));

    slides.forEach((slide, slideIndex) => slide.classList.toggle("active", slideIndex === nextIndex));
    dots.forEach((dot, dotIndex) => {
      dot.classList.toggle("active", dotIndex === nextIndex);
      dot.setAttribute('aria-current', dotIndex === nextIndex ? 'step' : 'false');
    });
    deck.dataset.currentSlide = String(nextIndex);
    const progress = document.getElementById('reportProgress');
    if (progress) progress.style.setProperty('--reading-progress', `${(nextIndex + 1) / slides.length * 100}%`);

    document.getElementById("reportPrev").disabled = nextIndex === 0;
    document.getElementById("reportNext").disabled = nextIndex === slides.length - 1;
    document.getElementById("reportPage").textContent =
      `${String(nextIndex + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;
  }

  window.moveReportSlide = function(direction) {
    const deck = document.getElementById("reportDeck");
    if (!deck) return;
    showReportSlide(Number(deck.dataset.currentSlide || 0) + direction);
  }

async function renderDashboards() {
    const container = document.getElementById("dashboards");

    if (tracked.length === 0 || selectedStockId === null) {
      container.innerHTML = `<div class="dash-card financial-empty">
        <p class="empty-eyebrow">FINANCIAL ANALYSIS</p>
        <h2>把財報，變成<br>看得懂的資訊。</h2>
        <p class="empty-description">從營收、獲利到現金流，透過財務圖表與 AI 重點解讀，掌握公司的營運變化。</p>
        <div class="empty-features">
          <div class="empty-feature"><svg viewBox="0 0 100 52" fill="none" aria-hidden="true"><path d="M2 49H98" stroke="#d9e1ec"/><rect x="10" y="29" width="14" height="20" rx="2" fill="#c2cedd"/><rect x="33" y="20" width="14" height="29" rx="2" fill="#b4c4d4"/><rect x="56" y="25" width="14" height="24" rx="2" fill="#c2cedd"/><rect x="79" y="7" width="14" height="42" rx="2" fill="#a99abd"/></svg><strong>財務圖表</strong></div>
          <div class="empty-feature"><svg viewBox="0 0 100 52" fill="none" aria-hidden="true"><rect x="5" y="5" width="90" height="42" rx="5" fill="#eeebf5"/><path d="M17 17H62M17 26H82M17 35H48" stroke="#b4a6ce" stroke-width="4" stroke-linecap="round"/></svg><strong>AI 重點解讀</strong></div>
          <div class="empty-feature"><svg viewBox="0 0 100 52" fill="none" aria-hidden="true"><circle cx="50" cy="26" r="19" stroke="#e0e7ee" stroke-width="5"/><path d="M50 7A19 19 0 0 1 69 26" stroke="#9db8c5" stroke-width="5" stroke-linecap="round"/><path d="M50 16V27L59 32" stroke="#8c9eb5" stroke-width="2" stroke-linecap="round"/></svg><strong>保存追蹤清單</strong></div>
        </div>
        <p class="empty-hint">${isGuest ? '登入後即可建立自己的財報分析。' : '在追蹤區輸入股票代碼，建立你的第一份財報分析。美股、台股皆可使用。'}</p>
      </div>`;
      return;
    }

    const s = tracked.find(item => item.id === selectedStockId);
    if (!s) { container.innerHTML = ""; return; }
    const isTw = isTaiwanStock(s.symbol);

    if (s.status === 'financial_error') {
      container.innerHTML = `<div class="dash-card state-card" role="status"><h2>${escapeFinancial(s.symbol)} 財報未完成</h2>
        <p>資料或 AI 服務暫時無法完成處理，請稍後重試。已保存的追蹤紀錄不會刪除。</p>
        <button id="retryFinancialBtn" type="button">重新生成</button></div>`;
      document.getElementById('retryFinancialBtn').addEventListener('click', async event => {
        event.currentTarget.disabled = true;
        try { await startFinancialReport(s.id); await loadTrackedStocks(); }
        catch (error) { alert(error.message); }
        finally { const button = document.getElementById('retryFinancialBtn'); if (button) button.disabled = false; }
      });
      return;
    }
    if (['pending', 'financial_queued', 'financial_running'].includes(s.status)) {
      container.innerHTML = `
        <div class="dash-card state-card" role="status" aria-live="polite">
          <span class="financial-loading-mark" aria-hidden="true"></span>
          <h2>正在整理 ${escapeFinancial(s.symbol)} 的財報</h2>
          <p>${s.status === 'financial_queued'
            ? '後端已收到任務，正在等待處理。完成後此頁會自動更新。'
            : isTw ? '後端正在取得月營收、季報數據並生成台股分析，完成後此頁會自動更新。'
            : '後端正在取得官方文件、財務數據並生成分析，完成後此頁會自動更新。'}</p>
          ${s.status === 'pending' ? '<button type="button" id="startFinancialBtn">開始生成</button>' : ''}
        </div>`;
      document.getElementById('startFinancialBtn')?.addEventListener('click', async event => {
        event.currentTarget.disabled = true;
        try { await startFinancialReport(s.id); await loadTrackedStocks(); }
        catch (error) { alert(error.message); }
        finally { const button = document.getElementById('startFinancialBtn'); if (button) button.disabled = false; }
      });
      return;
    }

    const demo = isGuest && s.demo === true;
    const version = initVersion;
    const { data: { session } } = await supabaseClient.auth.getSession();
    const accessToken = session?.access_token || "";
    const refreshToken = session?.refresh_token || "";

    if (version !== initVersion || selectedStockId !== s.id || currentUser?.id !== session?.user?.id) return;
    let authenticatedUrl = demo ? 'https://hims-chart.vercel.app/?demo=1' : null;
    if (!demo && s.report_url) {
      try {
        const url = new URL(s.report_url);
        if (url.origin === 'https://hims-chart.vercel.app') {
          url.searchParams.set('access_token', accessToken);
          url.searchParams.set('refresh_token', refreshToken);
          authenticatedUrl = url.href;
        }
      } catch { /* Never send session credentials to an arbitrary report URL. */ }
    }

    const summaryHtml = buildReportDeck(s.summary, s.symbol);
    const officialHtml = isTw ? '' : renderOfficialDocument(s.report_json);
    
    const iframeHtml = authenticatedUrl 
      ? `<iframe src="${escapeFinancial(authenticatedUrl)}" referrerpolicy="no-referrer" title="財務圖表"></iframe>`
      : `<div style="text-align:center; padding:40px; background:#f9fafb; border-radius:8px;">尚未連結圖表數據</div>`;

    const reportTitle = isTw ? `${escapeFinancial(s.symbol)} 台股財務追蹤報告` : `${escapeFinancial(s.symbol)} 財務分析報告`;
    const financialTabText = isTw ? "月營收與季報追蹤" : "三大財報及估值分析";
    const docTabText = isTw ? "台股月營收分析" : "官方原文與中文摘要";

    container.innerHTML = `
      <div class="dash-card">
        <div class="dashboard-heading">
          <div><p class="dashboard-eyebrow">FINANCIAL REPORT</p><h2>${reportTitle}</h2></div>
          <span class="status-badge">${demo ? 'AAPL 固定示範' : ['review', 'tw_review'].includes(s.status) ? "AI 分析待更新" : "已完成"}</span>
        </div>
        ${demo ? '<p><a href="index.html?login=1" target="_blank" rel="noopener">登入以分析自己的股票</a></p>' : ''}

        ${['review', 'tw_review'].includes(s.status) ? '<div style="margin:12px 0;"><button id="resumeFinancialBtn" type="button">完成財報分析</button></div>' : ''}

        <div class="tab-container">
          <button id="btn-financial" class="tab-btn active" onclick="switchView('financial')">${financialTabText}</button>
          <button id="btn-doc" class="tab-btn" onclick="switchView('doc')">${docTabText}</button>
        </div>

        <div id="view-financial" class="view-section active">
          ${iframeHtml}
        </div>

        <div id="view-doc" class="view-section">
          ${officialHtml}
          ${!isTw && s.summary ? '<div class="translation-heading"><h3>AI 中文重點摘要</h3></div>' : ''}
          ${summaryHtml}
        </div>
        ${renderFinancialSources(s.report_json)}
      </div>
    `;
    document.getElementById('resumeFinancialBtn')?.addEventListener('click', async event => {
      event.currentTarget.disabled = true;
      try { await startFinancialReport(s.id); await loadTrackedStocks(); }
      catch (error) { alert(error.message); }
      finally { const button = document.getElementById('resumeFinancialBtn'); if (button) button.disabled = false; }
    });
}

  function updateAddButtonState() {
    const addBtn = document.getElementById("addBtn");
    if (addingStock) { addBtn.disabled = true; return; }
    if (isGuest) {
      addBtn.disabled = false;
      addBtn.textContent = '登入以分析其他股票';
      return;
    }
    if (tracked.length >= currentLimit) {
      addBtn.disabled = true;
      addBtn.textContent = "已達 5 檔追蹤上限";
    } else {
      addBtn.disabled = false;
      addBtn.textContent = "新增追蹤";
    }
  }

  async function addStock() {
    if (addingStock) return;
    if (isGuest) {
      window.open("index.html?login=1", "_blank", "noopener");
      return;
    }
    const input = document.getElementById("symbolInput");
    const enteredSymbol = input.value.trim().toUpperCase();
    const symbolRaw = isTaiwanStock(enteredSymbol) ? enteredSymbol.replace(/\.(TW|TWO)$/, '') : enteredSymbol;
    if (!symbolRaw) return;
    if (!/^[A-Z0-9][A-Z0-9.^-]{0,19}$/.test(symbolRaw)) { alert('股票代碼格式不正確。'); return; }

    if (tracked.length >= currentLimit) {
      alert(`目前最多可追蹤 ${currentLimit} 檔，請先移除其他股票。`);
      return;
    }

    const addBtn = document.getElementById("addBtn");
    addingStock = true;
    addBtn.disabled = true;
    try {
      if (!currentUser || currentUser.is_anonymous) throw new Error('請先登入會員。');
      const row = {
        user_id: currentUser.id,
        symbol: symbolRaw,
        status: "pending", 
        summary: null
      };
      const query = supabaseClient.from("tracked_stocks");
      const { data: inserted, error } = await query.upsert(row, { onConflict: 'user_id, symbol' }).select('id').single();
      if (error) throw error;
      input.value = "";
      await loadTrackedStocks();
      await startFinancialReport(inserted.id);
      await loadTrackedStocks();
    } catch (error) {
      alert("新增或啟動未完成：" + error.message + ' 若清單已有這支股票，可從報告頁重試。');
    } finally {
      addingStock = false;
      updateAddButtonState();
    }
}

  async function removeStock(id) {
    if (isGuest || !currentUser) return;
    if(!confirm("確定要移除嗎？")) return;
    const { error } = await supabaseClient
      .from("tracked_stocks")
      .delete()
      .eq("id", id)
      .eq("user_id", currentUser.id);

    if (error) {
      alert("移除失敗");
      return;
    }
    await loadTrackedStocks();
  }

  document.getElementById("addBtn").addEventListener("click", addStock);
  document.getElementById('symbolInput').addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229 || event.repeat) return;
    event.preventDefault();
    document.getElementById('addBtn').click();
  });
  window.addEventListener('pagehide', () => clearTimeout(pollTimer));
  window.addEventListener('pageshow', event => { if (event.persisted) void loadTrackedStocks(); });
  supabaseClient.auth.onAuthStateChange((event) => {
    if (["SIGNED_IN", "SIGNED_OUT", "USER_UPDATED"].includes(event)) setTimeout(init, 0);
  });
  init();
</script>
</body>
</html>
