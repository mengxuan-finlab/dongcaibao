<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>懂才抱｜公司新聞雷達</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --good: #059669;
      --bad: #dc2626;
      --warn: #ea580c;
    }

    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, #eef2ff 0%, #ffffff 260px);
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
    }

    .wrap {
      max-width: 1050px;
      margin: 0 auto;
      padding: 52px 20px 90px;
    }

    .hero {
      padding: 28px;
      background: rgba(255,255,255,.86);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(79,70,229,.08);
      margin-bottom: 22px;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    .subtitle {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .search {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }

    button {
      padding: 0 20px;
      color: white;
      font: inherit;
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .58;
      cursor: wait;
    }

    .meta {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 22px 0 14px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .news-card {
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(15,23,42,.05);
    }

    .news-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .news-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
    }

    .news-title a {
      color: inherit;
      text-decoration: none;
    }

    .news-title a:hover {
      color: var(--primary);
    }

    .source {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      min-width: 250px;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
      background: #f1f5f9;
      color: #334155;
      white-space: nowrap;
    }

    .badge.high { background: #fee2e2; color: #991b1b; }
    .badge.medium { background: #ffedd5; color: #9a3412; }
    .badge.low { background: #dcfce7; color: #166534; }
    .badge.positive { background: #dcfce7; color: #166534; }
    .badge.negative { background: #fee2e2; color: #991b1b; }
    .badge.neutral { background: #e0f2fe; color: #075985; }

    .body {
      margin-top: 14px;
      color: #334155;
      line-height: 1.75;
    }

    .follow {
      margin-top: 12px;
      padding: 12px;
      color: #475569;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
    }

    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    @media (max-width: 720px) {
      .wrap { padding: 32px 14px 70px; }
      .search, .news-top, .toolbar { flex-direction: column; }
      button { width: 100%; min-height: 48px; }
      .badges { justify-content: flex-start; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <p class="kicker">NEWS RADAR</p>
      <h1>公司新聞雷達</h1>
      <p class="subtitle">輸入股票代號，AI 會整理近期新聞並判斷重要性、可能利多利空、影響性質，以及下一步該追蹤什麼。</p>
      <div class="search">
        <input id="symbolInput" placeholder="例如 HIMS、NVDA、2330" autocomplete="off" />
        <button id="scanBtn">掃描新聞</button>
      </div>
      <div class="meta">重要性不是股價預測，而是這則新聞是否可能改變你的研究假設。</div>
    </section>

    <div class="toolbar">
      <div class="status" id="statusText">請輸入股票代號開始。</div>
      <div class="status" id="countText"></div>
    </div>
    <section class="grid" id="resultGrid"></section>
  </main>

  <script>
    const SUPABASE_URL = "https://zlkexplsleznuebighte.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getApiBase() {
      return location.hostname === "127.0.0.1" || location.hostname === "localhost"
        ? "http://localhost:3000"
        : "https://dongcaibao.onrender.com";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeSymbol(value) {
      return String(value || "").trim().toUpperCase();
    }

    function badgeClass(value) {
      const text = String(value || "");
      if (text.includes("高")) return "high";
      if (text.includes("中")) return "medium";
      if (text.includes("低")) return "low";
      if (text.includes("利多")) return "positive";
      if (text.includes("利空")) return "negative";
      if (text.includes("中性")) return "neutral";
      return "";
    }

    function renderItems(payload) {
      const grid = document.getElementById("resultGrid");
      const items = payload.items || [];
      document.getElementById("countText").textContent = `${payload.symbol} · ${payload.market} · ${items.length} 則`;

      if (!items.length) {
        grid.innerHTML = `<div class="empty">目前沒有找到足夠相關的近期新聞。</div>`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <article class="news-card">
          <div class="news-top">
            <div>
              <h2 class="news-title">
                <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
              </h2>
              <div class="source">${escapeHtml(item.source || "未知來源")} ${item.date ? `｜${escapeHtml(item.date)}` : ""}</div>
            </div>
            <div class="badges">
              <span class="badge ${badgeClass(item.importance)}">重要性：${escapeHtml(item.importance || "未判斷")}</span>
              <span class="badge ${badgeClass(item.impact || item.direction)}">可能影響：${escapeHtml(item.impact || item.direction || "尚不明確")}</span>
              <span class="badge">影響性質：${escapeHtml(item.impactType || item.horizon || "未判斷")}</span>
            </div>
          </div>
          <div class="body"><strong>AI 判讀：</strong>${escapeHtml(item.why || "目前資料不足以判斷。")}</div>
          <div class="follow"><strong>後續追蹤：</strong>${escapeHtml(item.followUp || "持續觀察後續新聞與財報訊號。")}</div>
        </article>
      `).join("");
    }

    async function scanNews() {
      const symbol = normalizeSymbol(document.getElementById("symbolInput").value);
      const btn = document.getElementById("scanBtn");
      const status = document.getElementById("statusText");
      const grid = document.getElementById("resultGrid");

      if (!symbol) {
        status.textContent = "請先輸入股票代號。";
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        status.textContent = "請先登入才能使用新聞雷達。";
        return;
      }

      btn.disabled = true;
      btn.textContent = "分析中...";
      status.textContent = `正在掃描 ${symbol} 近期新聞...`;
      grid.innerHTML = `<div class="empty">AI 正在判斷新聞重要性，請稍候。</div>`;

      try {
        const response = await fetch(`${getApiBase()}/api/news-radar`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ symbol })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "新聞雷達分析失敗");
        status.textContent = "掃描完成。";
        renderItems(payload);
      } catch (error) {
        status.textContent = `錯誤：${error.message}`;
        grid.innerHTML = `<div class="empty">暫時無法完成新聞雷達分析。</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "掃描新聞";
      }
    }

    document.getElementById("scanBtn").addEventListener("click", scanNews);
    document.getElementById("symbolInput").addEventListener("keydown", event => {
      if (event.key !== "Enter" || event.isComposing) return;
      event.preventDefault();
      scanNews();
    });
  </script>
</body>
</html>
